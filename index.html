function stamp(c){
  const x = c.getContext("2d"), w = c.width, h = c.height;
  x.save();
  x.globalAlpha = 0.22;
  x.fillStyle = "#fff"; x.strokeStyle = "rgba(0,0,0,.5)"; x.lineWidth = 1;
  x.font = `700 ${Math.max(14, w/22|0)}px Georgia,serif`;
  x.translate(w/2, h/2); x.rotate(-Math.PI/6);
  {
    const step = Math.max(70, w/5|0), span = Math.hypot(w,h);
    const tw0 = x.measureText(WATERMARK).width + 40;
    for (let yy=-span; yy<span; yy+=step){
      for (let xx=-span+((yy/step|0)%2 ? tw0/2 : 0); xx<span; xx+=tw0){
        x.fillText(WATERMARK, xx, yy); x.strokeText(WATERMARK, xx, yy);
      }
    }
  }
  x.restore();
  x.save();
  x.globalAlpha = 1;
  x.font = `700 ${Math.max(13, w/26|0)}px Georgia,serif`;
  const tw = x.measureText(WATERMARK).width;
  x.fillStyle = "rgba(0,0,0,.65)"; x.fillRect(w-tw-20, h-32, tw+20, 32);
  x.fillStyle = "#fff"; x.fillText(WATERMARK, w-tw-10, h-12);

}

/* ------------------------------------------------------------ canvas utils */
const newCanvas = (w,h) => { const c = document.createElement("canvas"); c.width = Math.max(1,w|0); c.height = Math.max(1,h|0); return c; };
const ctxOf = c => c.getContext("2d", { willReadFrequently:true });
const tick = () => new Promise(r => setTimeout(r, 0));

function loadImg(src){
  return new Promise((res,rej)=>{
    const im = new Image();
    im.crossOrigin = "anonymous";
    im.onload = () => res(im);
    im.onerror = () => rej(new Error("could not read image"));
    im.src = src;
  });
}
function fitCanvas(img, max=1024){
  const s = Math.min(1, max/Math.max(img.width, img.height));
  const c = newCanvas(Math.round(img.width*s), Math.round(img.height*s));
  ctxOf(c).drawImage(img, 0, 0, c.width, c.height);
  return c;
}
function scaleCanvas(src, w, h){
  const c = newCanvas(w,h);
  const x = ctxOf(c);
  x.imageSmoothingEnabled = true; x.imageSmoothingQuality = "high";
  x.drawImage(src, 0, 0, w, h);
  return c;
}
function cropCanvas(src, x0, y0, w, h){
  const c = newCanvas(w,h);
  ctxOf(c).drawImage(src, -x0, -y0);
  return c;
}
const imgDataOf = c => ctxOf(c).getImageData(0, 0, c.width, c.height);
const alphaOf   = c => { const d = imgDataOf(c).data, n = c.width*c.height, a = new Uint8Array(n);
  for (let i=0;i<n;i++) a[i] = d[i*4+3]; return a; };

/* ------------------------------------------------------------ mask helpers */
function buildCatMask(cats, keepArr, outW, outH){
  const keep = new Set(keepArr);
  const { raw, w, h } = cats;
  const tmp = newCanvas(w,h), tctx = ctxOf(tmp);
  const img = tctx.createImageData(w,h);
  for (let i=0;i<w*h;i++){
    const on = keep.has(raw[i]|0);
    img.data[i*4] = img.data[i*4+1] = img.data[i*4+2] = 255;
    img.data[i*4+3] = on ? 255 : 0;
  }
  tctx.putImageData(img,0,0);
  const out = newCanvas(outW,outH);
  const ox = ctxOf(out);
  ox.imageSmoothingEnabled = true;
  ox.drawImage(tmp, 0, 0, outW, outH);
  return out;
}
function blurMask(c, px){
  const out = newCanvas(c.width, c.height);
  const x = ctxOf(out);
  try { x.filter = `blur(${Math.max(0,px)}px)`; } catch(_){}
  x.drawImage(c, 0, 0);
  try { x.filter = "none"; } catch(_){}
  return out;
}
function threshMask(c, t){
  const w = c.width, h = c.height;
  const d = ctxOf(c).getImageData(0,0,w,h);
  for (let i=0;i<w*h;i++){
    d.data[i*4] = d.data[i*4+1] = d.data[i*4+2] = 255;
    d.data[i*4+3] = d.data[i*4+3] > t ? 255 : 0;
  }
  const out = newCanvas(w,h);
  ctxOf(out).putImageData(d, 0, 0);
  return out;
}
function maskOp(a, b, op){
  const w = a.width, h = a.height;
  const da = ctxOf(a).getImageData(0,0,w,h).data;
  const db = ctxOf(b).getImageData(0,0,w,h).data;
  const out = newCanvas(w,h), ox = ctxOf(out);
  const im = ox.createImageData(w,h);
  for (let i=0;i<w*h;i++){
    const A = da[i*4+3], B = db[i*4+3];
    let v = 0;
    if (op === "and") v = A < B ? A : B;
    else if (op === "or") v = A > B ? A : B;
    else if (op === "sub") v = Math.max(0, A-B);
    im.data[i*4] = im.data[i*4+1] = im.data[i*4+2] = 255;
    im.data[i*4+3] = v;
  }
  ox.putImageData(im, 0, 0);
  return out;
}
function blendByMask(base, over, maskCanvas){
  const w = base.width, h = base.height;
  const b = ctxOf(base).getImageData(0,0,w,h);
  const o = ctxOf(over).getImageData(0,0,w,h);
  const m = ctxOf(maskCanvas).getImageData(0,0,w,h).data;
  for (let i=0;i<w*h;i++){
    const a = m[i*4+3]/255;
    if (a <= 0.001) continue;
    const p = i*4;
    b.data[p]   = o.data[p]  *a + b.data[p]  *(1-a);
    b.data[p+1] = o.data[p+1]*a + b.data[p+1]*(1-a);
    b.data[p+2] = o.data[p+2]*a + b.data[p+2]*(1-a);
  }
  ctxOf(base).putImageData(b, 0, 0);
  return base;
}
function ellipseMask(W, H, cx, cy, rx, ry, rot){

/* --------------------------------------------------------------- mediapipe */
const WASM = "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm";

/* ---------------------------------------------------------------- TPS core */
function luDecomp(A, n){
  const piv = new Int32Array(n);
  for (let k=0;k<n;k++){
    let p = k, mx = Math.abs(A[k*n+k]);
    for (let i=k+1;i<n;i++){ const v = Math.abs(A[i*n+k]); if (v > mx){ mx = v; p = i; } }
    piv[k] = p;
    if (p !== k) for (let j=0;j<n;j++){ const t = A[k*n+j]; A[k*n+j] = A[p*n+j]; A[p*n+j] = t; }
    const d = A[k*n+k] || 1e-12;
    for (let i=k+1;i<n;i++){
      const f = A[i*n+k] / d;
      A[i*n+k] = f;
      if (f !== 0) for (let j=k+1;j<n;j++) A[i*n+j] -= f * A[k*n+j];
    }
  }
  return piv;
}
function luSolve(A, piv, b, n){
  const x = new Float64Array(n);
  for (let i=0;i<n;i++) x[i] = b[i];
  for (let k=0;k<n;k++){ const p = piv[k]; if (p !== k){ const t = x[k]; x[k] = x[p]; x[p] = t; } }
  for (let i=0;i<n;i++){ let s = x[i]; for (let j=0;j<i;j++) s -= A[i*n+j]*x[j]; x[i] = s; }
  for (let i=n-1;i>=0;i--){ let s = x[i]; for (let j=i+1;j<n;j++) s -= A[i*n+j]*x[j]; x[i] = s / (A[i*n+i] || 1e-12); }
  return x;
}
function tpsFit(cx, cy, vx, vy, lambda){
  const n = cx.length, N = n + 3;
  const A = new Float64Array(N*N);
  for (let i=0;i<n;i++){
    for (let j=0;j<n;j++){
      const dx = cx[i]-cx[j], dy = cy[i]-cy[j];
      const r2 = dx*dx + dy*dy;
      A[i*N+j] = r2 > 1e-12 ? 0.5*r2*Math.log(r2) : 0;
    }
    A[i*N+i] += lambda;
    A[i*N+n] = 1; A[i*N+n+1] = cx[i]; A[i*N+n+2] = cy[i];
    A[n*N+i] = 1; A[(n+1)*N+i] = cx[i]; A[(n+2)*N+i] = cy[i];
  }
  const piv = luDecomp(A, N);
  const wx = luSolve(A, piv, vx, N);
  const wy = luSolve(A, piv, vy, N);
  return { cx, cy, wx, wy, n };
}
function tpsEval(t, x, y){
  const { cx, cy, wx, wy, n } = t;
  let ux = wx[n] + wx[n+1]*x + wx[n+2]*y;
  let uy = wy[n] + wy[n+1]*x + wy[n+2]*y;
  for (let i=0;i<n;i++){
    const dx = x-cx[i], dy = y-cy[i];
    const r2 = dx*dx + dy*dy;
    const k = r2 > 1e-12 ? 0.5*r2*Math.log(r2) : 0;
    ux += wx[i]*k; uy += wy[i]*k;
  }
  return [ux, uy];
}
function buildDestToSrcMap(D, ctrlDst, ctrlSrc, gw, gh){
  const n = ctrlDst.length / 2;
  let cdx=0, cdy=0, csx=0, csy=0;
  for (let i=0;i<n;i++){ cdx += ctrlDst[i*2]; cdy += ctrlDst[i*2+1]; csx += ctrlSrc[i*2]; csy += ctrlSrc[i*2+1]; }
  cdx/=n; cdy/=n; csx/=n; csy/=n;
  let sd=0, ss=0;
  for (let i=0;i<n;i++){
    sd += Math.hypot(ctrlDst[i*2]-cdx, ctrlDst[i*2+1]-cdy);
    ss += Math.hypot(ctrlSrc[i*2]-csx, ctrlSrc[i*2+1]-csy);
  }
  sd = (sd/n) || 1; ss = (ss/n) || 1;

  const cx = new Float64Array(n), cy = new Float64Array(n);
  const vx = new Float64Array(n), vy = new Float64Array(n);
  for (let i=0;i<n;i++){
    cx[i] = (ctrlDst[i*2]   - cdx) / sd;
    cy[i] = (ctrlDst[i*2+1] - cdy) / sd;
    vx[i] = (ctrlSrc[i*2]   - csx) / ss;
    vy[i] = (ctrlSrc[i*2+1] - csy) / ss;
  }
  const t = tpsFit(cx, cy, vx, vy, 1e-3);

  const W = D.width, H = D.height;
  const mx = new Float32Array((gw+1)*(gh+1));
  const my = new Float32Array((gw+1)*(gh+1));
  for (let j=0;j<=gh;j++){
    const py = j/gh*H;
    for (let i=0;i<=gw;i++){
      const px = i/gw*W;
      const [ux, uy] = tpsEval(t, (px-cdx)/sd, (py-cdy)/sd);
      const k = j*(gw+1)+i;
      mx[k] = ux*ss + csx;
      my[k] = uy*ss + csy;
    }
  }
  return { mx, my, gw, gh };
}

/* --------------------------------------------------------------- warping */
function warpToDest(srcCanvas, map, W, H){
  const sw = srcCanvas.width, sh = srcCanvas.height;
  const sd = ctxOf(srcCanvas).getImageData(0,0,sw,sh).data;
  const out = newCanvas(W,H), octx = ctxOf(out);
  const od = octx.createImageData(W,H);
  const dd = od.data;
  const { mx, my, gw, gh } = map;
  const row = gw + 1;

  for (let y=0;y<H;y++){
    const gy = y/H*gh;
    let j = gy|0; if (j > gh-1) j = gh-1;
    const ty = gy - j;
    const r0 = j*row, r1 = (j+1)*row;
    for (let x=0;x<W;x++){
      const gx = x/W*gw;
      let i = gx|0; if (i > gw-1) i = gw-1;
      const tx = gx - i;
      const w00 = (1-tx)*(1-ty), w10 = tx*(1-ty), w01 = (1-tx)*ty, w11 = tx*ty;

      const sx = mx[r0+i]*w00 + mx[r0+i+1]*w10 + mx[r1+i]*w01 + mx[r1+i+1]*w11;
      const sy = my[r0+i]*w00 + my[r0+i+1]*w10 + my[r1+i]*w01 + my[r1+i+1]*w11;
      const p = (y*W + x)*4;

      if (!(sx >= 0 && sy >= 0 && sx <= sw-1.001 && sy <= sh-1.001)){ dd[p+3] = 0; continue; }

      const x0 = sx|0, y0 = sy|0;
      const fx = sx-x0, fy = sy-y0;
      const x1 = Math.min(sw-1, x0+1), y1 = Math.min(sh-1, y0+1);
      const i00 = (y0*sw+x0)*4, i10 = (y0*sw+x1)*4, i01 = (y1*sw+x0)*4, i11 = (y1*sw+x1)*4;
      const a00 = (1-fx)*(1-fy), a10 = fx*(1-fy), a01 = (1-fx)*fy, a11 = fx*fy;

      dd[p]   = sd[i00]  *a00 + sd[i10]  *a10 + sd[i01]  *a01 + sd[i11]  *a11;
      dd[p+1] = sd[i00+1]*a00 + sd[i10+1]*a10 + sd[i01+1]*a01 + sd[i11+1]*a11;
      dd[p+2] = sd[i00+2]*a00 + sd[i10+2]*a10 + sd[i01+2]*a01 + sd[i11+2]*a11;
      dd[p+3] = sd[i00+3]*a00 + sd[i10+3]*a10 + sd[i01+3]*a01 + sd[i11+3]*a11;
    }
  }
  octx.putImageData(od, 0, 0);
  return out;
}

/* ------------------------------------------------------------ LAB colour */
const srgb2lin = c => { c /= 255; return c <= 0.04045 ? c/12.92 : Math.pow((c+0.055)/1.055, 2.4); };
const lin2srgb = c => { const v = c <= 0.0031308 ? c*12.92 : 1.055*Math.pow(c, 1/2.4) - 0.055;
  return v <= 0 ? 0 : v >= 1 ? 255 : v*255; };
const labF  = t => t > 0.008856451679 ? Math.cbrt(t) : (7.787037037*t + 0.1379310345);
const labFi = t => { const t3 = t*t*t; return t3 > 0.008856451679 ? t3 : (t - 0.1379310345)/7.787037037; };

function rgb2lab(r,g,b){
  const R = srgb2lin(r), G = srgb2lin(g), B = srgb2lin(b);
  const X = (0.4124564*R + 0.3575761*G + 0.1804375*B) / 0.95047;
  const Y = (0.2126729*R + 0.7151522*G + 0.0721750*B);
  const Z = (0.0193339*R + 0.1191920*G + 0.9503041*B) / 1.08883;
  const fx = labF(X), fy = labF(Y), fz = labF(Z);
  return [116*fy - 16, 500*(fx-fy), 200*(fy-fz)];
}
function lab2rgb(L,a,b){
  const fy = (L+16)/116, fx = fy + a/500, fz = fy - b/200;
  const X = 0.95047*labFi(fx), Y = labFi(fy), Z = 1.08883*labFi(fz);
  return [
    lin2srgb( 3.2404542*X - 1.5371385*Y - 0.4985314*Z),
    lin2srgb(-0.9692660*X + 1.8760108*Y + 0.0415560*Z),
    lin2srgb( 0.0556434*X - 0.2040259*Y + 1.0572252*Z)
  ];
}
function labStats(imgData, alphaMask, thr){
  const d = imgData.data, n = imgData.width * imgData.height;
  let cnt=0, mL=0, ma=0, mb=0, qL=0, qa=0, qb=0;
  for (let i=0;i<n;i++){
    if (alphaMask[i] < thr) continue;
    const p = i*4;
    const [L,A,B] = rgb2lab(d[p], d[p+1], d[p+2]);
    mL += L; ma += A; mb += B;
    qL += L*L; qa += A*A; qb += B*B;
    cnt++;
  }
  if (cnt < 30) return null;
  mL/=cnt; ma/=cnt; mb/=cnt;
  return {
    n: cnt, mL, ma, mb,
    sL: Math.sqrt(Math.max(4, qL/cnt - mL*mL)),
    sa: Math.sqrt(Math.max(4, qa/cnt - ma*ma)),
    sb: Math.sqrt(Math.max(4, qb/cnt - mb*mb)),
  };
}
function transferSkin(srcCanvas, applyMask, srcStats, dstStats){
  if (!srcStats || !dstStats) return;
  const w = srcCanvas.width, h = srcCanvas.height;
  const ctx = ctxOf(srcCanvas);
  const im = ctx.getImageData(0,0,w,h);
  const d = im.data, n = w*h;

  const clampK = k => Math.max(0.55, Math.min(1.75, k));
  const kL = clampK(dstStats.sL / srcStats.sL);
  const ka = clampK(dstStats.sa / srcStats.sa);
  const kb = clampK(dstStats.sb / srcStats.sb);
  const mix = 0.72;

  for (let i=0;i<n;i++){
    const a = applyMask[i]/255;
    if (a <= 0.01) continue;
    const p = i*4;
    let [L,A,B] = rgb2lab(d[p], d[p+1], d[p+2]);
    L = (L - srcStats.mL) * (1-mix + mix*kL) + srcStats.mL + mix*(dstStats.mL - srcStats.mL);
    A = (A - srcStats.ma) * (1-mix + mix*ka) + srcStats.ma + mix*(dstStats.ma - srcStats.ma);
    B = (B - srcStats.mb) * (1-mix + mix*kb) + srcStats.mb + mix*(dstStats.mb - srcStats.mb);
    const [r,g,b] = lab2rgb(L,A,B);
    d[p] = r; d[p+1] = g; d[p+2] = b;
  }
  ctx.putImageData(im, 0, 0);
}

/* ---------------------------------------------------- multigrid Poisson */
function bilinear(a, w, h, x, y){
  if (w < 2 || h < 2) return a[0] || 0;
  if (x < 0) x = 0; else if (x > w-1.001) x = w-1.001;
  if (y < 0) y = 0; else if (y > h-1.001) y = h-1.001;
  const x0 = x|0, y0 = y|0, tx = x-x0, ty = y-y0;
  const i = y0*w + x0;
  return a[i]*(1-tx)*(1-ty) + a[i+1]*tx*(1-ty) + a[i+w]*(1-tx)*ty + a[i+w+1]*tx*ty;
}
function downF(a, w, h, nw, nh){
  const out = new Float32Array(nw*nh);
  const sx = w/nw, sy = h/nh;
  for (let y=0;y<nh;y++){
    const y0 = Math.floor(y*sy), y1 = Math.min(h, Math.ceil((y+1)*sy)) || y0+1;
    for (let x=0;x<nw;x++){
      const x0 = Math.floor(x*sx), x1 = Math.min(w, Math.ceil((x+1)*sx)) || x0+1;
      let s = 0, c = 0;
      for (let yy=y0; yy<y1; yy++) for (let xx=x0; xx<x1; xx++){ s += a[yy*w+xx]; c++; }
      out[y*nw+x] = c ? s/c : 0;
    }
  }
  return out;
}
function upF(a, w, h, nw, nh){
  const out = new Float32Array(nw*nh);
  const sx = w/nw, sy = h/nh;
  for (let y=0;y<nh;y++){
    const fy = (y+0.5)*sy - 0.5;
    for (let x=0;x<nw;x++){
      out[y*nw+x] = bilinear(a, w, h, (x+0.5)*sx - 0.5, fy);
    }
  }
  return out;
}
function downMask(m, w, h, nw, nh){
  const f = downF(m, w, h, nw, nh);
  const out = new Uint8Array(nw*nh);
  for (let i=0;i<out.length;i++) out[i] = f[i] > 0.5 ? 1 : 0;
  return out;
}
function jacobi(f, dst, src, mask, w, h, iters){
  const n = w*h;
  let a = f, b = new Float32Array(n);
  for (let it=0; it<iters; it++){
    for (let i=0;i<n;i++) if (!mask[i]) b[i] = dst[i];
    for (let y=1; y<h-1; y++){
      const row = y*w;
      for (let x=1; x<w-1; x++){
        const i = row + x;
        if (!mask[i]) continue;
        const g = 4*src[i] - src[i-1] - src[i+1] - src[i-w] - src[i+w];
        b[i] = (a[i-1] + a[i+1] + a[i-w] + a[i+w] + g) * 0.25;
      }
    }
    for (let x=0; x<w; x++){ b[x] = dst[x]; b[(h-1)*w+x] = dst[(h-1)*w+x]; }
    for (let y=1; y<h-1; y++){ b[y*w] = dst[y*w]; b[y*w+w-1] = dst[y*w+w-1]; }
    const t = a; a = b; b = t;
  }
  return a;
}
function poissonBlendRegion(dstC, srcC, mask, w, h){
  const dims = [[w,h]];
  const lvD = [dstC], lvS = [srcC], lvM = [mask];
  let cw = w, ch = h;
  while (cw > 20 && ch > 20 && lvD.length < 6){
    const nw = Math.max(10, cw >> 1), nh = Math.max(10, ch >> 1);
    lvD.push(dstC.map(c => downF(c, cw, ch, nw, nh)));
    lvS.push(srcC.map(c => downF(c, cw, ch, nw, nh)));
    lvM.push(downMask(lvM[lvM.length-1], cw, ch, nw, nh));
    dims.push([nw, nh]);
    cw = nw; ch = nh;
  }

  let f = null;
  for (let L = dims.length-1; L >= 0; L--){
    const [W,H] = dims[L];
    const m = lvM[L];
    if (f){
      const [pw, ph] = dims[L+1];
      f = f.map(c => upF(c, pw, ph, W, H));
    } else {
      f = lvS[L].map(c => c.slice());
    }
    for (let i=0;i<W*H;i++){
      if (!m[i]) for (let ci=0; ci<3; ci++) f[ci][i] = lvD[L][ci][i];
    }
    const iters = L === 0 ? 70 : 220;
    f = f.map((c, ci) => jacobi(c, lvD[L][ci], lvS[L][ci], m, W, H, iters));
  }
  return f;
}

/* --------------------------------------------------------------- masking */
function headMaskFrom(cats, W, H, lms){
  let hair = null, face = null, body = null;
  try { hair = buildCatMask(cats, [1], W, H); } catch(_){}
  try { face = buildCatMask(cats, [3], W, H); } catch(_){}
  try { body = buildCatMask(cats, [2], W, H); } catch(_){}

  const have = hair && face;
  let core;
  if (have){
    core = maskOp(hair, face, "or");
  } else {
    core = null;
  }

  if (core){
    let area = 0;
    const a = alphaOf(scaleCanvas(core, 64, 64));
    for (let i=0;i<a.length;i++) if (a[i] > 40) area++;
    if (area < 64*64*0.02) core = null;
  }
  if (!core){
    if (!lms) return null;
    const pts = lms.map(p => [p.x*W, p.y*H]);
    let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
    for (const [x,y] of pts){ if(x<x0)x0=x; if(x>x1)x1=x; if(y<y0)y0=y; if(y>y1)y1=y; }
    const cx = (x0+x1)/2, cy = (y0+y1)/2;
    const rx = (x1-x0)*0.78, ry = (y1-y0)*0.95;
    return ellipseMask(W, H, cx, cy - ry*0.15, rx, ry, 0);
  }

  const r = Math.max(4, Math.round(Math.min(W,H)*0.035));
  const grown = threshMask(blurMask(core, r), 40);
  if (body){
    const all = maskOp(maskOp(hair || core, face || core, "or"), body, "or");
    return maskOp(grown, all, "and");
  }
  return grown;
}

/* ------------------------------------------------------------------ swap */
async function swapHeads(onProgress){
  onProgress(0.03, "Loading photos");
  await tick();
  const srcImg = await loadImg(state.source.url);
  const dstImg = await loadImg(state.dest.url);
  const S = fitCanvas(srcImg, 1024);
  const D = fitCanvas(dstImg, 1024);

  onProgress(0.10, "Detecting faces");
  await tick();
  const [sLm, dLm] = await Promise.all([landmarks(S), landmarks(D)]);
  if (!sLm) throw new Error("No face found in the source photo.");
  if (!dLm) throw new Error("No face found in the target photo.");

  onProgress(0.20, "Segmenting hair and skin");
  await tick();
  const [sCats, dCats] = await Promise.all([segmentCats(S), segmentCats(D)]);

  const sHead = headMaskFrom(sCats, S.width, S.height, sLm);
  const sFace = buildCatMask(sCats, [3], S.width, S.height);
  const dFace = buildCatMask(dCats, [3], D.width, D.height);
  const dHead = headMaskFrom(dCats, D.width, D.height, dLm);

  const ctrlSrc = [], ctrlDst = [];
  for (const i of CTRL_IDX){
    const a = sLm[i], b = dLm[i];
    if (!a || !b) continue;
    ctrlDst.push(b.x*D.width, b.y*D.height);
    ctrlSrc.push(a.x*S.width, a.y*S.height);
  }
  if (ctrlDst.length < 30) throw new Error("Could not map the faces (too few landmarks).");

  onProgress(0.28, "Solving thin-plate-spline alignment");
  await tick();
  const GW = 144, GH = 144;
  const map = buildDestToSrcMap(D, ctrlDst, ctrlSrc, GW, GH);

  onProgress(0.38, "Warping head onto target");
  await tick();
  const warpedImg  = warpToDest(S, map, D.width, D.height);
  const warpedHead = warpToDest(sHead, map, D.width, D.height);
  const warpedFace = warpToDest(sFace, map, D.width, D.height);

  const headSoft = threshMask(warpedHead, 80);
  const headGrown = threshMask(blurMask(headSoft, Math.max(3, Math.min(D.width,D.height)*0.006)), 30);
  const feather = blurMask(headGrown, Math.max(3, Math.min(D.width,D.height)*0.011));
  const poissonHard = threshMask(blurMask(headGrown, 3), 70);
  const faceSoft = threshMask(warpedFace, 90);

  onProgress(0.50, "Matching skin tone in LAB");
  await tick();
  const warpedFaceAlpha = alphaOf(warpedFace);
  const sStats = labStats(imgDataOf(warpedImg), warpedFaceAlpha, 120);
  const dStats = labStats(imgDataOf(D), alphaOf(scaleCanvas(dFace, D.width, D.height)), 120);
  const applyAlpha = alphaOf(warpedHead);
  transferSkin(warpedImg, applyAlpha, sStats, dStats);

  const cleared = newCanvas(D.width, D.height);
  const cc = ctxOf(cleared);
  cc.drawImage(D, 0, 0);
  if (dHead){
    const blurBig = newCanvas(D.width, D.height);
    const bx = ctxOf(blurBig);
    try { bx.filter = `blur(${Math.round(Math.min(D.width,D.height)*0.06)}px)`; } catch(_){}
    bx.drawImage(D, 0, 0);
    try { bx.filter = "none"; } catch(_){}
    const dHeadSoft = blurMask(dHead, Math.round(Math.min(D.width,D.height)*0.02));
    blendByMask(cleared, blurBig, dHeadSoft);
  }

  onProgress(0.58, "Solving seamless clone");
  await tick();
  const bb = (()=>{
    const w = D.width, h = D.height;
    const d = alphaOf(scaleCanvas(headGrown, Math.round(w/2), Math.round(h/2)));
    const sw = Math.round(w/2), sh = Math.round(h/2);
    let x0=sw, y0=sh, x1=0, y1=0, found=false;
    for (let y=0;y<sh;y++) for (let x=0;x<sw;x++){
      if (d[y*sw+x] > 30){
        found = true;
        if (x<x0)x0=x; if (x>x1)x1=x; if (y<y0)y0=y; if (y>y1)y1=y;
      }
    }
    if (!found) return { x0:0, y0:0, x1:w-1, y1:h-1 };
    x0*=2; y0*=2; x1=x1*2+1; y1=y1*2+1;
    const mx = Math.round(w*0.04), my = Math.round(h*0.04);
    return {
      x0: Math.max(0, x0-mx), y0: Math.max(0, y0-my),
      x1: Math.min(w-1, x1+mx), y1: Math.min(h-1, y1+my)
    };
  })();

  const bw = Math.max(8, bb.x1-bb.x0+1);
  const bh = Math.max(8, bb.y1-bb.y0+1);

  const dstCrop  = cropCanvas(cleared, bb.x0, bb.y0, bw, bh);
  const srcCrop  = cropCanvas(warpedImg, bb.x0, bb.y0, bw, bh);
  const maskCrop = cropCanvas(poissonHard, bb.x0, bb.y0, bw, bh);
  const featCrop = cropCanvas(feather, bb.x0, bb.y0, bw, bh);
  const srcAlphaCrop = alphaOf(srcCrop);

  const PW = Math.max(16, Math.min(360, bw));
  const PH = Math.max(16, Math.round(bh * (PW/bw)));
  const sw2 = Math.min(bw, PW), sh2 = Math.min(bh, PH);

  const dstSmall  = scaleCanvas(dstCrop, sw2, sh2);
  const srcSmall  = scaleCanvas(srcCrop, sw2, sh2);
  const maskSmall = threshMask(scaleCanvas(maskCrop, sw2, sh2), 110);

  const toCh = (canvas) => {
    const d = imgDataOf(canvas).data, n = canvas.width*canvas.height;
    const out = [new Float32Array(n), new Float32Array(n), new Float32Array(n)];
    for (let i=0,p=0;i<n;i++,p+=4){ out[0][i]=d[p]; out[1][i]=d[p+1]; out[2][i]=d[p+2]; }
    return out;
  };

  const dstCh = toCh(dstSmall);
  const srcCh = toCh(srcSmall);
  const mArr = new Uint8Array(sw2*sh2);
  {
    const a = alphaOf(maskSmall);
    for (let i=0;i<a.length;i++) mArr[i] = a[i] > 127 ? 1 : 0;
  }

  await tick();
  onProgress(0.68, "Relaxing Poisson field (multigrid)");
  await tick();

  const solved = poissonBlendRegion(dstCh, srcCh, mArr, sw2, sh2);

  const corr = [0,1,2].map(ci => {
    const c = new Float32Array(sw2*sh2);
    for (let i=0;i<c.length;i++) c[i] = solved[ci][i] - srcCh[ci][i];
    return upF(c, sw2, sh2, bw, bh);
  });

  onProgress(0.86, "Compositing");
  await tick();

  const outCrop = newCanvas(bw, bh);
  const octx = ctxOf(outCrop);
  const outIm = octx.createImageData(bw, bh);
  const srcD = imgDataOf(srcCrop).data;
  const dstD = imgDataOf(dstCrop).data;
  const feat = alphaOf(featCrop);
  const od = outIm.data;

  for (let i=0;i<bw*bh;i++){
    const p = i*4;
    const aFeat = feat[i]/255;
    const aSrc  = srcAlphaCrop[i]/255;
    const a = aFeat * aSrc;
    if (a <= 0.002){
      od[p] = dstD[p]; od[p+1] = dstD[p+1]; od[p+2] = dstD[p+2]; od[p+3] = 255;
      continue;
    }
    let r = srcD[p]   + corr[0][i];
    let g = srcD[p+1] + corr[1][i];
    let b = srcD[p+2] + corr[2][i];
    r = r < 0 ? 0 : r > 255 ? 255 : r;
    g = g < 0 ? 0 : g > 255 ? 255 : g;
    b = b < 0 ? 0 : b > 255 ? 255 : b;
    od[p]   = r*a + dstD[p]  *(1-a);
    od[p+1] = g*a + dstD[p+1]*(1-a);
    od[p+2] = b*a + dstD[p+2]*(1-a);
    od[p+3] = 255;
  }
  octx.putImageData(outIm, 0, 0);

  const final = newCanvas(D.width, D.height);
  const fx = ctxOf(final);
  fx.drawImage(cleared, 0, 0);
  fx.drawImage(outCrop, bb.x0, bb.y0);

  stamp(final);
  onProgress(1, "Done");
  return final;
}

/* ------------------------------------------------------------ video clip */
async function framesToVideo(still, prompt){
  const p = (prompt || "").toLowerCase();
  const zoom = /(closer|walk|toward|zoom)/.test(p) ? 0.22 : 0.13;
  const pan  = /(turn|left|right|tilt)/.test(p) ? 0.03 : 0.012;
  const fps = 12, n = 40;
  const w = still.width - still.width % 2, h = still.height - still.height % 2;
  const frame = newCanvas(w, h);
  const ctx = ctxOf(frame);

  const paint = i => {
    const t = i / Math.max(1, n-1);
    ctx.fillStyle = "#000"; ctx.fillRect(0,0,w,h);
    ctx.save();
    ctx.translate(w/2, h/2);
    const s = 1 + zoom*t;
    ctx.rotate(Math.sin(t*Math.PI*2)*0.012);
    ctx.scale(s, s);
    ctx.translate(Math.sin(t*Math.PI)*pan*w, Math.sin(t*Math.PI*2)*0.004*h);
    ctx.drawImage(still, -w/2, -h/2, w, h);
    ctx.restore();
    stamp(frame);
  };

  if (typeof MediaRecorder === "undefined" || !frame.captureStream){
    paint(n-1);
    return { kind:"image", url: frame.toDataURL("image/jpeg", .92), note:"no recorder on this browser" };
  }

  const stream = frame.captureStream(fps);
  const mime = ["video/mp4","video/webm;codecs=vp8","video/webm"].find(t => MediaRecorder.isTypeSupported(t)) || "";
  let rec;
  try { rec = mime ? new MediaRecorder(stream, { mimeType: mime }) : new MediaRecorder(stream); }
  catch(_){ rec = new MediaRecorder(stream); }

  const chunks = [];
  rec.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
  const done = new Promise(r => rec.onstop = r);

  paint(0);
  rec.start(80);
  await new Promise(r => setTimeout(r, 80));
  for (let i=0;i<n;i++){
    paint(i);
    await new Promise(r => setTimeout(r, 1000/fps));
  }
  if (rec.state === "recording") rec.stop();
  await done;
  stream.getTracks().forEach(t => t.stop());

  const blob = new Blob(chunks, { type: rec.mimeType || "video/mp4" });
  if (!blob.size){
    paint(n-1);
    return { kind:"image", url: frame.toDataURL("image/jpeg", .92), note:"empty recording" };
  }
  return { kind:"video", url: URL.createObjectURL(blob) };
}

/* ----------------------------------------------------------- sandbox faces */
function hash(s){ let h = 2166136261; for (const ch of s) h = Math.imul(h ^ ch.charCodeAt(0), 16777619); return h >>> 0; }
function rng(seed){ let x = seed || 1; return () => { x ^= x<<13; x ^= x>>>17; x ^= x<<5; return ((x>>>0)%1000)/1000; }; }
function sandboxFace(label){
  const rnd = rng(hash(label)), size = 440, c = newCanvas(size,size);
  const ctx = ctxOf(c);
  ctx.fillStyle = `rgb(${40+rnd()*80},${50+rnd()*80},${70+rnd()*90})`;
  ctx.fillRect(0,0,size,size);
  const cx = size/2, cy = size*.52;
  ctx.fillStyle = `rgb(${20+rnd()*50},${15+rnd()*40},${10+rnd()*30})`;
  ctx.beginPath(); ctx.ellipse(cx, cy-40, size*.38, size*.42, 0, Math.PI, 0); ctx.fill();
  ctx.fillStyle = `rgb(${155+rnd()*60},${120+rnd()*50},${100+rnd()*40})`;
  ctx.beginPath(); ctx.ellipse(cx, cy, size*.24, size*.30, 0, 0, 7); ctx.fill();
  stamp(c);
  return c.toDataURL("image/jpeg", .9);
}

  try {

async function runSwap(){

  if (!g.ok){ state.err = g.reason; render(); return; }
  if (!state.source.url || !state.dest.url){ state.err = "Need both photos."; render(); return; }
  state.busy = true; state.err = ""; state.progress = 0; render();
  try {
    if (!state.lastStill){
      const c = await swapHeads(setProg);
      state.lastStill = c;
    }
    setProg(0.9, "Rendering clip");
    state.result = await framesToVideo(state.lastStill, state.prompt);
  } catch(e){
    console.error(e);
    state.err = e.message || String(e);
  }
  state.busy = false;
  render();
}

/* ------------------------------------------------------------ gate/consent */
function enter(age, name, ack){
  if (!ack){ state.err = "Tick the ethics box."; render(); return; }
  if (+age < 18){ state.err = "18+ only."; render(); return; }
  state.subject = { subject_id: crypto.randomUUID(), age_verified:true, attested_age:+age, display_name: name || "operator" };
  state.view = "studio"; state.err = ""; save(); render();
}
function startConsent(){
  state.consent = { consent_id: crypto.randomUUID(), status:"started", purpose:state.purpose, id_verified:false, liveness_passed:false };
  state.msg = "ID stub → liveness stub → sign."; save(); render();
}
function signConsent(){
  if (!state.consent){ state.err = "Start first."; render(); return; }
  if (!state.consent.id_verified || !state.consent.liveness_passed){ state.err = "Do both stubs."; render(); return; }
  if (!state.typed.toLowerCase().includes(PHRASE.toLowerCase())){ state.err = "Type the agreement phrase."; render(); return; }
  if (!state.sig.trim()){ state.err = "Name."; render(); return; }
  state.consent = { ...state.consent, status:"signed", signature_name: state.sig.trim(), signed_at: new Date().toISOString() };
  state.msg = "Signed."; state.err = ""; save(); render();
}

/* ------------------------------------------------------------------ render */
function render(){
  const el = document.getElementById("app");

  if (state.view === "gate"){
    el.innerHTML = `<p class="wm">18+ · ${WATERMARK}</p><h1>Gotcha Lab</h1>
      <div class="warn"><p>Landmark-driven thin-plate-spline warp, LAB skin matching, then a multigrid Poisson clone so the seam solves into the target's lighting. Runs entirely in this browser tab.</p>
      <ul><li>No minors.</li><li>Real photos need checkbox + signed consent.</li><li>No sexual or nude content.</li></ul></div>
      <div class="panel"><label>Name</label><input id="name" type="text"/><label>Age</label><input id="age" type="number" value="18"/>
      <label><input id="ack" type="checkbox"/> I am 18+ and will not use minors or anyone who did not consent.</label>
      ${state.err ? `<p class="err">${state.err}</p>` : ""}<button id="enter">Enter lab</button></div>`;
    el.querySelector("#enter").onclick = () => enter(el.querySelector("#age").value, el.querySelector("#name").value, el.querySelector("#ack").checked);
    return;
  }

  const nav = `<nav><button class="${state.view==="studio"?"":"ghost"}" data-v="studio">Studio</button><button class="${state.view==="consent"?"":"ghost"}" data-v="consent">Consent</button></nav><p class="wm">${WATERMARK}</p>`;

  if (state.view === "consent"){
    el.innerHTML = `${nav}<h2>Consent</h2>${state.err?`<p class="err">${state.err}</p>`:""}${state.msg?`<p class="ok">${state.msg}</p>`:""}
      <div class="panel"><label>Purpose</label><textarea id="purpose">${state.purpose}</textarea>
      <button id="start">Start session</button><p class="muted">Status: ${state.consent?.status || "none"}</p>
      <div class="row"><button class="ghost" id="idv">ID stub</button><button class="ghost" id="liv">Liveness stub</button></div>
      <label>Sign as</label><input id="sig" type="text" value="${state.sig}"/>
      <label>Type: ${PHRASE}</label><textarea id="typed">${state.typed}</textarea><button id="sign">Sign</button></div>`;
    el.querySelectorAll("[data-v]").forEach(b => b.onclick = () => { state.view = b.dataset.v; state.err = ""; render(); });
    el.querySelector("#purpose").oninput = e => state.purpose = e.target.value;
    el.querySelector("#sig").oninput = e => state.sig = e.target.value;
    el.querySelector("#typed").oninput = e => state.typed = e.target.value;
    el.querySelector("#start").onclick = startConsent;
    el.querySelector("#idv").onclick = () => { if (state.consent){ state.consent.id_verified = true; state.consent.status = "id_verified"; save(); render(); } };
    el.querySelector("#liv").onclick = () => { if (state.consent){ state.consent.liveness_passed = true; state.consent.status = "liveness_verified"; save(); render(); } };
    el.querySelector("#sign").onclick = signConsent;
    return;
  }

  el.innerHTML = `${nav}<h2>Studio</h2>
    <p class="muted">Two clear photos, one face each, facing roughly the same way. First run downloads the vision models (~10 MB).</p>
    ${state.err ? `<p class="err">${state.err}</p>` : ""}
    ${state.busy ? `<div class="panel"><p id="pstat">${state.status || "Working"}</p><div class="bar"><i id="pbar" style="width:${Math.round(state.progress*100)}%"></i></div></div>` : ""}
    <div class="panel"><h3>Sandbox</h3><div class="faces" id="faces"></div></div>
    <div class="panel"><h3>Source head</h3><label><input id="boxs" type="checkbox" ${state.source.box?"checked":""}/> I have consent for this head</label>
      <input id="srcfile" type="file" accept="image/*"/><input id="srccam" type="file" accept="image/*" capture="user"/>
      ${state.source.url?`<img class="preview" src="${state.source.url}" alt="source"/>`:""}</div>
    <div class="panel"><h3>Target body</h3><label><input id="boxd" type="checkbox" ${state.dest.box?"checked":""}/> I have consent for this photo</label>
      <input id="dstfile" type="file" accept="image/*"/><input id="dstcam" type="file" accept="image/*" capture="environment"/>
      ${state.dest.url?`<img class="preview" src="${state.dest.url}" alt="dest"/>`:""}</div>
    <div class="panel"><label>Video move</label><textarea id="prompt">${state.prompt}</textarea>
      <button id="swap" ${state.busy?"disabled":""}>${state.busy?"Working…":"Swap head"}</button>
      <button class="ghost" id="vid" ${state.busy?"disabled":""}>Make video</button></div>
    ${state.result?`<div class="panel"><h3>Result</h3>${state.result.note?`<p class="muted">${state.result.note}</p>`:""}
      ${state.result.kind==="video"
        ? `<video class="preview" controls playsinline autoplay loop src="${state.result.url}"></video>`
        : `<img class="preview" src="${state.result.url}" alt="result"/>`}
      <p class="wm">${WATERMARK}</p><button id="share">Share / Save to Photos</button></div>`:""}`;

  const faces = el.querySelector("#faces");
  state.sandbox.forEach(item => {
    const b = document.createElement("button");
    b.className = "ghost";
    b.innerHTML = `<img src="${item.url}" alt=""/><div class="muted">${item.label.replace("sandbox-","")}</div>`;
    b.onclick = () => pickSandbox(item);
    faces.appendChild(b);
  });

  el.querySelectorAll("[data-v]").forEach(b => b.onclick = () => { state.view = b.dataset.v; state.err = ""; render(); });
  el.querySelector("#boxs").onchange = e => state.source.box = e.target.checked;
  el.querySelector("#boxd").onchange = e => state.dest.box = e.target.checked;
  el.querySelector("#prompt").oninput = e => state.prompt = e.target.value;
  el.querySelector("#srcfile").onchange = e => e.target.files[0] && onFile("source", e.target.files[0]);
  el.querySelector("#srccam").onchange  = e => e.target.files[0] && onFile("source", e.target.files[0]);
  el.querySelector("#dstfile").onchange = e => e.target.files[0] && onFile("dest", e.target.files[0]);
  el.querySelector("#dstcam").onchange  = e => e.target.files[0] && onFile("dest", e.target.files[0]);
  el.querySelector("#swap").onclick = runSwap;
  el.querySelector("#vid").onclick = runVideo;
  const sh = el.querySelector("#share");
  if (sh) sh.onclick = shareResult;
}

/* -------------------------------------------------------------- bootstrap */
state.sandbox = ["north","east","south","west","studio","gold"]
  .map(n => ({ label: "sandbox-" + n, url: sandboxFace("sandbox-" + n) }));

render();
</script>
</body>
</html>
