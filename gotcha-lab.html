<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Gotcha Lab" />
  <meta name="theme-color" content="#0b0c10" />
  <title>Gotcha Lab</title>
  <style>
    :root { --bg:#0b0c10; --panel:#171a21; --ink:#efece7; --muted:#9aa0a8; --gold:#e8c547; --danger:#ff6b6b; --ok:#6ee7b7; --line:#2c3140; }
    * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html,body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.45 Georgia,serif; min-height:100%; padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
    .wrap { max-width:560px; margin:0 auto; padding:16px; }
    h1{font-size:1.6rem;margin:0 0 .3rem} h2,h3{margin:.2rem 0 .6rem}
    .muted{color:var(--muted);font-size:.92rem} .wm{letter-spacing:.08em;text-transform:uppercase;font-size:.68rem;color:var(--muted)}
    .panel{background:var(--panel);border:1px solid var(--line);padding:14px;margin:12px 0;border-radius:10px}
    .warn{background:#2a1a12;border:1px solid #6b3a1f;padding:12px;border-radius:10px}
    button{display:inline-block;width:100%;margin:6px 0;padding:14px 12px;border:0;border-radius:10px;background:var(--gold);color:#111;font:700 16px/1 Georgia,serif}
    button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
    button:disabled{opacity:.5}
    label{display:block;margin:10px 0 6px;color:var(--muted)}
    input[type=text],input[type=number],textarea{width:100%;background:#0e1014;color:var(--ink);border:1px solid var(--line);padding:12px;border-radius:8px;font-size:16px}
    input[type=file],input[type=range]{width:100%;margin:8px 0}
    .row{display:flex;gap:8px} .row button{flex:1}
    .preview{width:100%;max-height:320px;object-fit:contain;background:#000;border-radius:8px}
    .faces{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
    .faces button{width:auto;padding:6px;margin:0}
    .faces img{width:72px;height:72px;display:block;border-radius:8px}
    .err{color:var(--danger)} .ok{color:var(--ok)} nav{display:flex;gap:8px} nav button{padding:10px}
    .bar{height:8px;background:#0e1014;border-radius:8px;overflow:hidden;margin:10px 0}
    .bar>i{display:block;height:100%;width:0;background:var(--gold)}
  </style>
</head>
<body>
<div class="wrap" id="app"></div>
<script type="module">
const WATERMARK="gotcha Ai generated";
const PHRASE="I understand this output is synthetic media labeled gotcha Ai generated";
const MINOR=[/\b(child|children|kid|kids|toddler|infant|baby|babies)\b/i,/\b(minor|underage|under[- ]age|under[- ]18|u18)\b/i,/\b(teen(?!ager adult)|teenage(?! adult)|teenie|tween)\b/i,/\b(young|little)\s+(boy|girl|child)\b/i,/\b(pre[- ]?teen|middle[- ]school|elementary)\b/i,/\b(1[0-7])[- ]year/i,/\bloli\b|\bshota\b|\bpedoph/i];
const NONCONSENT=[/\bwithout (their|her|his|the person's) (consent|knowledge|permission)\b/i,/\bthey don'?t know\b/i,/\bnon[- ]consensual\b/i,/\brevenge porn\b/i,/\bsecretly (film|record|swap)\b/i];
const SEXUAL=[/\b(nude|naked|nsfw|porn|porno|sex|sexual|sexy|explicit|topless|lingerie|erotic|undress|strip)\w*/i];
const MERGE_MS=32000;

const state={
  view:"gate",
  subject:JSON.parse(localStorage.getItem("gotcha.subject")||"null"),
  consent:JSON.parse(localStorage.getItem("gotcha.consent")||"null"),
  source:{url:null,real:false,box:false}, dest:{url:null,real:false,box:false},
  blend:1, prompt:"Turns toward camera, hair moves, soft light",
  busy:false, progress:0, status:"", err:"", msg:"", result:null, lastStill:null,
  sandbox:[], sig:"", typed:"", purpose:"phone lab, consented likeness",
};
if(state.subject?.age_verified) state.view="studio";
const save=()=>{localStorage.setItem("gotcha.subject",JSON.stringify(state.subject));localStorage.setItem("gotcha.consent",JSON.stringify(state.consent));};
function gateJob(){ const t=state.prompt||""; if(MINOR.some(r=>r.test(t))) return {ok:false,reason:"minors are not allowed"}; if(NONCONSENT.some(r=>r.test(t))) return {ok:false,reason:"non-consensual phrasing is blocked"}; if(SEXUAL.some(r=>r.test(t))) return {ok:false,reason:"sexual or nude content is not supported"}; if(state.source.real&&!state.source.box) return {ok:false,reason:"check consent on the source photo"}; if(state.dest.real&&!state.dest.box) return {ok:false,reason:"check consent on the destination photo"}; if((state.source.real||state.dest.real)&&state.consent?.status!=="signed") return {ok:false,reason:"sign consent first"}; return {ok:true}; }
function stamp(c){ const x=c.getContext("2d"),w=c.width,h=c.height; x.save(); x.globalAlpha=0.22; x.fillStyle="#fff"; x.strokeStyle="rgba(0,0,0,.5)"; x.lineWidth=1; x.font=`700 ${Math.max(14,w/22|0)}px Georgia,serif`; x.translate(w/2,h/2); x.rotate(-Math.PI/6); { const step=Math.max(70,w/5|0), span=Math.hypot(w,h), tw0=x.measureText(WATERMARK).width+40; for(let yy=-span;yy<span;yy+=step){ for(let xx=-span+((yy/step|0)%2?tw0/2:0);xx<span;xx+=tw0){ x.fillText(WATERMARK,xx,yy); x.strokeText(WATERMARK,xx,yy); } } } x.restore(); x.save(); x.globalAlpha=1; x.font=`700 ${Math.max(13,w/26|0)}px Georgia,serif`; const t=WATERMARK,tw=x.measureText(t).width; x.fillStyle="rgba(0,0,0,.65)"; x.fillRect(w-tw-20,h-32,tw+20,32); x.fillStyle="#fff"; x.fillText(t,w-tw-10,h-12); x.restore(); }
function loadImg(src){ return new Promise((res,rej)=>{ const im=new Image(); im.onload=()=>res(im); im.onerror=()=>rej(new Error("could not read image")); im.src=src; }); }
function toCanvas(img,max=900){ const s=Math.min(1,max/Math.max(img.width,img.height)); const c=document.createElement("canvas"); c.width=Math.max(2,Math.round(img.width*s)); c.height=Math.max(2,Math.round(img.height*s)); c.getContext("2d").drawImage(img,0,0,c.width,c.height); return c; }
function hash(s){ let h=2166136261; for(const ch of s) h=Math.imul(h^ch.charCodeAt(0),16777619); return h>>>0; }
function rng(seed){ let x=seed||1; return ()=>{ x^=x<<13; x^=x>>>17; x^=x<<5; return ((x>>>0)%1000)/1000; }; }
function sandboxFace(label){ const rnd=rng(hash(label)),size=440,c=document.createElement("canvas"); c.width=c.height=size; const ctx=c.getContext("2d"); ctx.fillStyle=`rgb(${40+rnd()*80},${50+rnd()*80},${70+rnd()*90})`; ctx.fillRect(0,0,size,size); const cx=size/2,cy=size*.52; ctx.fillStyle=`rgb(${20+rnd()*50},${15+rnd()*40},${10+rnd()*30})`; ctx.beginPath(); ctx.ellipse(cx,cy-40,size*.38,size*.42,0,Math.PI,0); ctx.fill(); ctx.fillStyle=`rgb(${155+rnd()*60},${120+rnd()*50},${100+rnd()*40})`; ctx.beginPath(); ctx.ellipse(cx,cy,size*.24,size*.30,0,0,7); ctx.fill(); stamp(c); return c.toDataURL("image/jpeg",.9); }
state.sandbox=["north","east","south","west","studio","gold"].map(n=>({label:"sandbox-"+n,url:sandboxFace("sandbox-"+n)}));
const tick=()=>new Promise(r=>setTimeout(r,0));
function setProg(p,msg){ state.progress=p; state.status=msg; const bar=document.getElementById("pbar"); const st=document.getElementById("pstat"); if(bar) bar.style.width=Math.round(p*100)+"%"; if(st) st.textContent=msg; }

const WASM="https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm";
const FACE_MODEL="https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task";
const SEG_MODEL="https://storage.googleapis.com/mediapipe-models/image_segmenter/selfie_multiclass_256x256/float32/1/selfie_multiclass_256x256.tflite";
let visionMod, faceLm, segmenter;
async function vision(){ if(!visionMod) visionMod=await import("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/+esm"); return visionMod; }
async function getFace(){ if(faceLm) return faceLm; const v=await vision(); faceLm=await v.FaceLandmarker.createFromOptions(await v.FilesetResolver.forVisionTasks(WASM),{baseOptions:{modelAssetPath:FACE_MODEL},runningMode:"IMAGE",numFaces:1}); return faceLm; }
async function getSeg(){ if(segmenter) return segmenter; const v=await vision(); segmenter=await v.ImageSegmenter.createFromOptions(await v.FilesetResolver.forVisionTasks(WASM),{baseOptions:{modelAssetPath:SEG_MODEL},runningMode:"IMAGE",outputCategoryMask:true}); return segmenter; }
async function landmarks(c){ try{ return (await getFace()).detect(c)?.faceLandmarks?.[0]||null; }catch{ return null; } }

function catMask(res,w,h,keep){
  const mask=res.categoryMask; if(!mask) return null;
  const raw=mask.getAsUint8Array?mask.getAsUint8Array():mask.getAsFloat32Array();
  const mw=mask.width,mh=mask.height, tmp=document.createElement("canvas"); tmp.width=mw; tmp.height=mh;
  const img=tmp.getContext("2d").createImageData(mw,mh);
  for(let i=0;i<mw*mh;i++){ const on=keep.has(raw[i]|0); img.data[i*4]=img.data[i*4+1]=img.data[i*4+2]=on?255:0; img.data[i*4+3]=255; }
  tmp.getContext("2d").putImageData(img,0,0);
  const c=document.createElement("canvas"); c.width=w; c.height=h; c.getContext("2d").drawImage(tmp,0,0,w,h); return c;
}
async function segmentHead(c){ try{ return catMask((await getSeg()).segment(c),c.width,c.height,new Set([1,2,3])); }catch{ return null; } }
function feat(lms,w,h){ const p=i=>[lms[i].x*w,lms[i].y*h]; const L=p(33),R=p(263),C=p(152),F=p(10); const mid=[(L[0]+R[0])/2,(L[1]+R[1])/2]; const eye=Math.hypot(R[0]-L[0],R[1]-L[1])||1; return {L,R,C,F,mid,eye,angle:Math.atan2(R[1]-L[1],R[0]-L[0])}; }
function helmet(c,lms){ const w=c.width,h=c.height,o=document.createElement("canvas"); o.width=w;o.height=h; const x=o.getContext("2d"); x.fillStyle="#fff"; if(!lms){ x.beginPath(); x.ellipse(w/2,h*.4,w*.3,h*.4,0,0,7); x.fill(); return o; } const f=feat(lms,w,h); const fh=Math.hypot(f.F[0]-f.C[0],f.F[1]-f.C[1])||f.eye*2.2; x.beginPath(); x.ellipse(f.mid[0], f.mid[1]-fh*.2, f.eye*1.65, fh*1.2, f.angle,0,7); x.fill(); return o; }
function blurMask(mask,px){ const c=document.createElement("canvas"); c.width=mask.width;c.height=mask.height; const x=c.getContext("2d"); x.filter=`blur(${px|0}px)`; x.drawImage(mask,0,0); x.filter="none"; return c; }
function scaleCanvas(src,w,h){ const c=document.createElement("canvas"); c.width=w;c.height=h; c.getContext("2d").drawImage(src,0,0,w,h); return c; }
function drawMapped(ctx,img,map){ ctx.save(); ctx.translate(map.dx,map.dy); ctx.rotate(map.rot); ctx.scale(map.scale,map.scale); ctx.translate(-map.sx,-map.sy); ctx.drawImage(img,0,0); ctx.restore(); }

function rgbArrays(canvas){ const {width:w,height:h}=canvas; const d=canvas.getContext("2d").getImageData(0,0,w,h).data; const r=new Float32Array(w*h),g=new Float32Array(w*h),b=new Float32Array(w*h); for(let i=0,p=0;i<d.length;i+=4,p++){ r[p]=d[i]; g[p]=d[i+1]; b[p]=d[i+2]; } return {w,h,r,g,b,a:d}; }
function maskArr(canvas,thresh){ const {width:w,height:h}=canvas; const d=canvas.getContext("2d").getImageData(0,0,w,h).data; const m=new Uint8Array(w*h); for(let i=0,p=0;i<d.length;i+=4,p++) m[p]=d[i]>thresh?1:0; return m; }
function softArr(canvas){ const {width:w,height:h}=canvas; const d=canvas.getContext("2d").getImageData(0,0,w,h).data; const m=new Float32Array(w*h); for(let i=0,p=0;i<d.length;i+=4,p++) m[p]=d[i]/255; return m; }

function poissonChannel(dst, src, mask, w, h, iters){
  const n=w*h; let a=dst.slice(0), b=new Float32Array(n);
  for(let it=0; it<iters; it++){
    const read=it%2===0?a:b, write=it%2===0?b:a;
    for(let y=1;y<h-1;y++){
      for(let x=1;x<w-1;x++){
        const i=y*w+x;
        if(!mask[i]){ write[i]=dst[i]; continue; }
        const guid=src[i]*4 - src[i-1]-src[i+1]-src[i-w]-src[i+w];
        write[i]=(read[i-1]+read[i+1]+read[i-w]+read[i+w]+guid)*0.25;
      }
    }
    for(let x=0;x<w;x++){ write[x]=dst[x]; write[(h-1)*w+x]=dst[(h-1)*w+x]; }
    for(let y=0;y<h;y++){ write[y*w]=dst[y*w]; write[y*w+w-1]=dst[y*w+w-1]; }
  }
  return iters%2===0?a:b;
}

function labMatch(srcC, dstC, maskC){
  const s=srcC.getContext("2d").getImageData(0,0,srcC.width,srcC.height);
  const d=dstC.getContext("2d").getImageData(0,0,dstC.width,dstC.height);
  const m=maskC.getContext("2d").getImageData(0,0,maskC.width,maskC.height);
  let sr=0,sg=0,sb=0,s2r=0,s2g=0,s2b=0,n=0, dr=0,dg=0,db=0,d2r=0,d2g=0,d2b=0,dn=0;
  const W=srcC.width;
  for(let i=0,p=0;i<s.data.length;i+=4,p++){
    if(m.data[i]>40 && s.data[i+3]>40){ const r=s.data[i],g=s.data[i+1],b=s.data[i+2]; sr+=r;sg+=g;sb+=b;s2r+=r*r;s2g+=g*g;s2b+=b*b;n++; }
  }
  for(let i=0;i<d.data.length;i+=4){
    const x=(i/4)%dstC.width, y=(i/4/dstC.width)|0;
    if(y>dstC.height*0.55 && y<dstC.height*0.82 && x>dstC.width*0.3 && x<dstC.width*0.7){
      const r=d.data[i],g=d.data[i+1],b=d.data[i+2]; dr+=r;dg+=g;db+=b;d2r+=r*r;d2g+=g*g;d2b+=b*b;dn++;
    }
  }
  if(n<40||dn<40) return srcC;
  sr/=n;sg/=n;sb/=n; dr/=dn;dg/=dn;db/=dn;
  const ssR=Math.sqrt(Math.max(8,s2r/n-sr*sr)), ssG=Math.sqrt(Math.max(8,s2g/n-sg*sg)), ssB=Math.sqrt(Math.max(8,s2b/n-sb*sb));
  const dsR=Math.sqrt(Math.max(8,d2r/dn-dr*dr)), dsG=Math.sqrt(Math.max(8,d2g/dn-dg*dg)), dsB=Math.sqrt(Math.max(8,d2b/dn-db*db));
  const k=0.62;
  const kr=1-k+k*(dsR/ssR), kg=1-k+k*(dsG/ssG), kb=1-k+k*(dsB/ssB);
  const or=1-k+k*(dr-sr), og=1-k+k*(dg-sg), ob=1-k+k*(db-sb);
  for(let i=0;i<s.data.length;i+=4){
    if(s.data[i+3]<8) continue;
    s.data[i]=Math.max(0,Math.min(255,(s.data[i]-sr)*kr+sr+or));
    s.data[i+1]=Math.max(0,Math.min(255,(s.data[i+1]-sg)*kg+sg+og));
    s.data[i+2]=Math.max(0,Math.min(255,(s.data[i+2]-sb)*kb+sb+ob));
  }
  srcC.getContext("2d").putImageData(s,0,0); return srcC;
}

function putRGB(canvas, r,g,b){
  const {width:w,height:h}=canvas; const img=canvas.getContext("2d").getImageData(0,0,w,h);
  for(let p=0,i=0;p<r.length;p++,i+=4){ img.data[i]=r[p]<0?0:r[p]>255?255:r[p]; img.data[i+1]=g[p]<0?0:g[p]>255?255:g[p]; img.data[i+2]=b[p]<0?0:b[p]>255?255:b[p]; img.data[i+3]=255; }
  canvas.getContext("2d").putImageData(img,0,0);
}

function mixSoft(base, over, soft){
  const {width:w,height:h}=base;
  const B=base.getContext("2d").getImageData(0,0,w,h);
  const O=over.getContext("2d").getImageData(0,0,w,h);
  const S=soft.getContext("2d").getImageData(0,0,w,h);
  for(let i=0;i<B.data.length;i+=4){
    const a=Math.min(1, S.data[i]/255);
    if(a<=0.001) continue;
    B.data[i]=O.data[i]*a+B.data[i]*(1-a);
    B.data[i+1]=O.data[i+1]*a+B.data[i+1]*(1-a);
    B.data[i+2]=O.data[i+2]*a+B.data[i+2]*(1-a);
  }
  base.getContext("2d").putImageData(B,0,0);
}

async function swapHeads(){
  setProg(0.02,"Reading photos");
  const src=toCanvas(await loadImg(state.source.url), 880);
  const dst=toCanvas(await loadImg(state.dest.url), 880);
  setProg(0.08,"Finding faces");
  const sl=await landmarks(src); const dl=await landmarks(dst);
  setProg(0.16,"Cutting hair and head");
  let sMask=await segmentHead(src); let dMask=await segmentHead(dst);
  if(!sMask) sMask=helmet(src,sl); if(!dMask) dMask=helmet(dst,dl);
  const sHard=blurMask(sMask, Math.max(6, Math.min(src.width,src.height)/40));
  const dHard=blurMask(dMask, Math.max(8, Math.min(dst.width,dst.height)/36));
  const srcF=sl?feat(sl,src.width,src.height):{mid:[src.width/2,src.height*.42],eye:src.width*.2,angle:0};
  const dstF=dl?feat(dl,dst.width,dst.height):{mid:[dst.width/2,dst.height*.42],eye:dst.width*.2,angle:0};
  const map={scale:dstF.eye/srcF.eye, rot:dstF.angle-srcF.angle, sx:srcF.mid[0], sy:srcF.mid[1], dx:dstF.mid[0], dy:dstF.mid[1]};

  const placed=document.createElement("canvas"); placed.width=dst.width; placed.height=dst.height;
  const pctx=placed.getContext("2d");
  const srcCut=document.createElement("canvas"); srcCut.width=src.width; srcCut.height=src.height;
  srcCut.getContext("2d").drawImage(src,0,0);
  labMatch(srcCut,dst,sHard);
  drawMapped(pctx, srcCut, map);
  const placedMask=document.createElement("canvas"); placedMask.width=dst.width; placedMask.height=dst.height;
  drawMapped(placedMask.getContext("2d"), sHard, map);

  setProg(0.28,"Clearing the old head");
  const cleared=document.createElement("canvas"); cleared.width=dst.width; cleared.height=dst.height;
  const cx=cleared.getContext("2d"); cx.drawImage(dst,0,0);
  const blur=document.createElement("canvas"); blur.width=dst.width; blur.height=dst.height;
  const bx=blur.getContext("2d"); bx.filter=`blur(${Math.max(18,Math.min(dst.width,dst.height)/9)}px)`; bx.drawImage(dst,0,0);
  mixSoft(cleared, blur, blurMask(dHard, Math.max(12, Math.min(dst.width,dst.height)/22)));

  const workW=Math.min(dst.width, 420);
  const workH=Math.max(2, Math.round(dst.height*(workW/dst.width)));
  const dstW=scaleCanvas(cleared, workW, workH);
  const srcW=scaleCanvas(placed, workW, workH);
  const mW=scaleCanvas(placedMask, workW, workH);
  const D=rgbArrays(dstW), S=rgbArrays(srcW), M=maskArr(mW, 40);

  const start=performance.now();
  let done=0;
  const chunk=18;
  while(performance.now()-start < MERGE_MS-2500){
    D.r=poissonChannel(D.r,S.r,M,workW,workH,chunk);
    D.g=poissonChannel(D.g,S.g,M,workW,workH,chunk);
    D.b=poissonChannel(D.b,S.b,M,workW,workH,chunk);
    done+=chunk;
    const t=(performance.now()-start)/MERGE_MS;
    setProg(0.32+t*0.55, `Solving seam · ${Math.round((performance.now()-start)/1000)}s / 32s · ${done} passes`);
    await tick();
  }
  putRGB(dstW, D.r,D.g,D.b);
  setProg(0.90,"Upscaling and neck blend");
  const solved=scaleCanvas(dstW, dst.width, dst.height);
  const soft=blurMask(placedMask, Math.max(10, Math.min(dst.width,dst.height)/26));
  const out=document.createElement("canvas"); out.width=dst.width; out.height=dst.height;
  out.getContext("2d").drawImage(cleared,0,0);
  mixSoft(out, solved, soft);
  const hi=out.getContext("2d");
  hi.globalAlpha=0.22;
  hi.drawImage(placed,0,0);
  hi.globalAlpha=1;
  stamp(out);
  setProg(1,"Done");
  return out;
}

async function framesToVideo(still,prompt){
  const p=(prompt||"").toLowerCase(); const zoom=/(closer|walk|toward)/.test(p)?0.2:0.12;
  const fps=12,n=36,w=still.width-still.width%2,h=still.height-still.height%2;
  const frame=document.createElement("canvas"); frame.width=w; frame.height=h; const ctx=frame.getContext("2d");
  const paint=i=>{ const t=i/Math.max(1,n-1); ctx.fillStyle="#000"; ctx.fillRect(0,0,w,h); ctx.save(); ctx.translate(w/2,h/2); ctx.rotate(Math.sin(t*6.28)*0.02); ctx.scale(1+zoom*t,1+zoom*t); ctx.drawImage(still,-w/2,-h/2,w,h); ctx.restore(); stamp(frame); };
  if(typeof MediaRecorder==="undefined"||!frame.captureStream){ paint(n-1); return {kind:"image",url:frame.toDataURL("image/jpeg",.92),note:"no recorder"}; }
  const stream=frame.captureStream(fps);
  const mime=["video/mp4","video/webm;codecs=vp8","video/webm"].find(t=>MediaRecorder.isTypeSupported(t))||"";
  let rec; try{ rec=mime?new MediaRecorder(stream,{mimeType:mime}):new MediaRecorder(stream);}catch{ rec=new MediaRecorder(stream); }
  const chunks=[]; rec.ondataavailable=e=>{ if(e.data&&e.data.size) chunks.push(e.data); };
  const done=new Promise(r=>rec.onstop=r); paint(0); rec.start(80); await new Promise(r=>setTimeout(r,80));
  for(let i=0;i<n;i++){ paint(i); await new Promise(r=>setTimeout(r,1000/fps)); }
  if(rec.state==="recording") rec.stop(); await done; stream.getTracks().forEach(t=>t.stop());
  const blob=new Blob(chunks,{type:rec.mimeType||"video/mp4"});
  if(!blob.size){ paint(n-1); return {kind:"image",url:frame.toDataURL("image/jpeg",.92),note:"empty recorder"}; }
  return {kind:"video",url:URL.createObjectURL(blob)};
}

function pickSandbox(item){ state.source={url:item.url,real:false,box:true}; if(!state.dest.url) state.dest={url:item.url,real:false,box:true}; render(); }
function onFile(which,file){ state[which]={url:URL.createObjectURL(file),real:true,box:state[which].box}; render(); }
async function shareResult(){ if(!state.result) return; try{ const blob=await (await fetch(state.result.url)).blob(); const file=new File([blob], state.result.kind==="video"?"gotcha.mp4":"gotcha.jpg",{type:blob.type}); if(navigator.canShare&&navigator.canShare({files:[file]})){ await navigator.share({files:[file],text:WATERMARK}); return; } }catch(_){ } window.open(state.result.url,"_blank"); }
async function runSwap(){ const g=gateJob(); if(!g.ok){state.err=g.reason;render();return;} if(!state.source.url||!state.dest.url){state.err="Need source head and target photo.";render();return;} state.busy=true; state.err=""; state.progress=0; state.status="Starting 32s merge"; render(); try{ const c=await swapHeads(); state.lastStill=c; state.result={kind:"image",url:c.toDataURL("image/jpeg",.93)}; }catch(e){ state.err=e.message||String(e);} state.busy=false; render(); }
async function runVideo(){ const g=gateJob(); if(!g.ok){state.err=g.reason;render();return;} if(!state.source.url||!state.dest.url){state.err="Need both photos.";render();return;} state.busy=true;state.err="";render(); try{ if(!state.lastStill) state.lastStill=await swapHeads(); state.result=await framesToVideo(state.lastStill,state.prompt);}catch(e){state.err=e.message||String(e);} state.busy=false;render(); }
function enter(age,name,ack){ if(!ack){state.err="Tick the ethics box.";render();return;} if(+age<18){state.err="18+ only.";render();return;} state.subject={subject_id:crypto.randomUUID(),age_verified:true,attested_age:+age,display_name:name||"operator"}; state.view="studio";state.err="";save();render(); }
function startConsent(){ state.consent={consent_id:crypto.randomUUID(),status:"started",purpose:state.purpose,id_verified:false,liveness_passed:false}; state.msg="ID stub → liveness stub → sign."; save();render(); }
function signConsent(){ if(!state.consent){state.err="Start first.";render();return;} if(!state.consent.id_verified||!state.consent.liveness_passed){state.err="Do both stubs.";render();return;} if(!state.typed.toLowerCase().includes(PHRASE.toLowerCase())){state.err="Type the agreement phrase.";render();return;} if(!state.sig.trim()){state.err="Name.";render();return;} state.consent={...state.consent,status:"signed",signature_name:state.sig.trim(),signed_at:new Date().toISOString()}; state.msg="Signed."; state.err=""; save();render(); }

function render(){
  const el=document.getElementById("app");
  if(state.view==="gate"){
    el.innerHTML=`<p class="wm">18+ · ${WATERMARK}</p><h1>Gotcha Lab</h1>
      <div class="warn"><p>Whole-head cut. Then a 32-second Poisson merge so the seam solves into the target light. Still a phone browser — not a $400 GPU rig — but it is not a five-year-old paste.</p>
      <ul><li>No minors.</li><li>Real photos need checkbox + signed consent.</li><li>No sexual or nude content.</li></ul></div>
      <div class="panel"><label>Name</label><input id="name" type="text"/><label>Age</label><input id="age" type="number" value="18"/>
      <label><input id="ack" type="checkbox"/> I am 18+ and will not use minors or anyone who did not consent.</label>
      ${state.err?`<p class="err">${state.err}</p>`:""}<button id="enter">Enter lab</button></div>`;
    el.querySelector("#enter").onclick=()=>enter(el.querySelector("#age").value,el.querySelector("#name").value,el.querySelector("#ack").checked); return;
  }
  const nav=`<nav><button class="${state.view==="studio"?"":"ghost"}" data-v="studio">Studio</button><button class="${state.view==="consent"?"":"ghost"}" data-v="consent">Consent</button></nav><p class="wm">${WATERMARK}</p>`;
  if(state.view==="consent"){
    el.innerHTML=`${nav}<h2>Consent</h2>${state.err?`<p class="err">${state.err}</p>`:""}${state.msg?`<p class="ok">${state.msg}</p>`:""}
      <div class="panel"><label>Purpose</label><textarea id="purpose">${state.purpose}</textarea>
      <button id="start">Start session</button><p class="muted">Status: ${state.consent?.status||"none"}</p>
      <div class="row"><button class="ghost" id="idv">ID stub</button><button class="ghost" id="liv">Liveness stub</button></div>
      <label>Sign as</label><input id="sig" type="text" value="${state.sig}"/>
      <label>Type: ${PHRASE}</label><textarea id="typed">${state.typed}</textarea><button id="sign">Sign</button></div>`;
    el.querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>{state.view=b.dataset.v;state.err="";render();});
    el.querySelector("#purpose").oninput=e=>state.purpose=e.target.value;
    el.querySelector("#sig").oninput=e=>state.sig=e.target.value;
    el.querySelector("#typed").oninput=e=>state.typed=e.target.value;
    el.querySelector("#start").onclick=startConsent;
    el.querySelector("#idv").onclick=()=>{if(state.consent){state.consent.id_verified=true;state.consent.status="id_verified";save();render();}};
    el.querySelector("#liv").onclick=()=>{if(state.consent){state.consent.liveness_passed=true;state.consent.status="liveness_verified";save();render();}};
    el.querySelector("#sign").onclick=signConsent; return;
  }
  el.innerHTML=`${nav}<h2>Studio</h2><p class="muted">Two real photos. Swap runs ~32 seconds on purpose — Poisson seam + color match. Leave the phone alone while the bar moves.</p>
    ${state.err?`<p class="err">${state.err}</p>`:""}
    ${state.busy?`<div class="panel"><p id="pstat">${state.status||"Working"}</p><div class="bar"><i id="pbar" style="width:${Math.round(state.progress*100)}%"></i></div></div>`:""}
    <div class="panel"><h3>Sandbox</h3><div class="faces" id="faces"></div></div>
    <div class="panel"><h3>Source head</h3><label><input id="boxs" type="checkbox" ${state.source.box?"checked":""}/> I have consent for this head</label>
      <input id="srcfile" type="file" accept="image/*"/><input id="srccam" type="file" accept="image/*" capture="user"/>
      ${state.source.url?`<img class="preview" src="${state.source.url}" alt="source"/>`:""}</div>
    <div class="panel"><h3>Target body</h3><label><input id="boxd" type="checkbox" ${state.dest.box?"checked":""}/> I have consent for this photo</label>
      <input id="dstfile" type="file" accept="image/*"/><input id="dstcam" type="file" accept="image/*" capture="environment"/>
      ${state.dest.url?`<img class="preview" src="${state.dest.url}" alt="dest"/>`:""}</div>
    <div class="panel"><label>Video move</label><textarea id="prompt">${state.prompt}</textarea>
      <button id="swap" ${state.busy?"disabled":""}>${state.busy?"Merging 32s…":"Swap whole head (32s merge)"}</button>
      <button class="ghost" id="vid" ${state.busy?"disabled":""}>Make video</button></div>
    ${state.result?`<div class="panel"><h3>Result</h3>${state.result.note?`<p class="muted">${state.result.note}</p>`:""}
      ${state.result.kind==="video"?`<video class="preview" controls playsinline autoplay loop src="${state.result.url}"></video>`:`<img class="preview" src="${state.result.url}" alt="result"/>`}
      <p class="wm">${WATERMARK}</p><button id="share">Share / Save to Photos</button></div>`:""}`;
  const faces=el.querySelector("#faces");
  state.sandbox.forEach(item=>{ const b=document.createElement("button"); b.className="ghost"; b.innerHTML=`<img src="${item.url}" alt=""/><div class="muted">${item.label.replace("sandbox-","")}</div>`; b.onclick=()=>pickSandbox(item); faces.appendChild(b); });
  el.querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>{state.view=b.dataset.v;state.err="";render();});
  el.querySelector("#boxs").onchange=e=>state.source.box=e.target.checked;
  el.querySelector("#boxd").onchange=e=>state.dest.box=e.target.checked;
  el.querySelector("#prompt").oninput=e=>state.prompt=e.target.value;
  el.querySelector("#srcfile").onchange=e=>e.target.files[0]&&onFile("source",e.target.files[0]);
  el.querySelector("#srccam").onchange=e=>e.target.files[0]&&onFile("source",e.target.files[0]);
  el.querySelector("#dstfile").onchange=e=>e.target.files[0]&&onFile("dest",e.target.files[0]);
  el.querySelector("#dstcam").onchange=e=>e.target.files[0]&&onFile("dest",e.target.files[0]);
  el.querySelector("#swap").onclick=runSwap;
  el.querySelector("#vid").onclick=runVideo;
  const sh=el.querySelector("#share"); if(sh) sh.onclick=shareResult;
}
render();
</script>
</body>
</html>
