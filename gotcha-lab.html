function delaunay(points) {
  const n = points.length;

    if (a <= 0.002) continue;
    bd[i] = hh[i] * a + bd[i] * (1 - a);
    bd[i+1] = hh[i+1] * a + bd[i+1] * (1 - a);
    bd[i+2] = hh[i+2] * a + bd[i+2] * (1 - a);
  }
  ctx.putImageData(b, 0, 0);
  return out;
}

function fallbackContour(w, h) {
  const cx = w * 0.5, cy = h * 0.46, rx = w * 0.22, ry = h * 0.32;
  const pts = [];
  for (let i = 0; i < 36; i++) {
    const t = (i / 36) * Math.PI * 2 - Math.PI / 2;
    const k = t < 0 || t > Math.PI ? 1.25 : 1;
    pts.push([cx + Math.cos(t) * rx * k, cy + Math.sin(t) * ry]);
  }
  return pts;
}

async function swapHeads() {
  const srcImg = await loadImg(state.source.url);
  const dstImg = await loadImg(state.dest.url);
  const src = toCanvas(srcImg, 720);
  const dst = toCanvas(dstImg, 720);
  const sl = await detectLandmarks(src);
  const dl = await detectLandmarks(dst);

  let result;
  if (sl && dl) {
    const srcPts = meshPoints(sl, src.width, src.height);
    const dstPts = meshPoints(dl, dst.width, dst.height);
    const n = Math.min(srcPts.length, dstPts.length);
    const sPts = srcPts.slice(0, n), dPts = dstPts.slice(0, n);
    const warped = warpHead(src, sPts, dPts, dst.width, dst.height);
    const dContour = headContour(dl, dst.width, dst.height);
    const cleared = eraseHead(dst, dContour);
    const mask = headMask(dst.width, dst.height, dContour, Math.max(dst.width, dst.height) * 0.045);
    const matched = colorMatch(warped, mask, dst, dContour);
    result = composite(cleared, matched, mask, Number(state.blend));
  } else {
    const sc = fallbackContour(src.width, src.height);
    const dc = fallbackContour(dst.width, dst.height);
    const sb = bboxOf(sc), db = bboxOf(dc);
    const head = document.createElement("canvas");
    head.width = dst.width; head.height = dst.height;
    const hctx = head.getContext("2d");
    hctx.drawImage(src, sb.x, sb.y, sb.w, sb.h, db.x, db.y, db.w, db.h);
    const cleared = eraseHead(dst, dc);
    const mask = headMask(dst.width, dst.height, dc, Math.max(dst.width, dst.height) * 0.05);
    const matched = colorMatch(head, mask, dst, dc);
    result = composite(cleared, matched, mask, Number(state.blend));
  }
  stamp(result);
  return result;
}

function motionFromPrompt(prompt) {
  const p = (prompt || "").toLowerCase();
  return {
    zoom: /(closer|walk|toward|approach)/.test(p) ? 0.22 : 0.14,
    turn: /(turn|look left)/.test(p) ? -0.07 : /(look right)/.test(p) ? 0.07 : 0.045,
    sway: /(hair|wind|smile|talk|breathe)/.test(p) ? 0.028 : 0.018,
  };
}

async function framesToVideo(stillCanvas, prompt) {
  const motion = motionFromPrompt(prompt);
  const fps = 12;
  const seconds = 3.2;
  const n = Math.round(fps * seconds);
  const w = stillCanvas.width - stillCanvas.width % 2;
  const h = stillCanvas.height - stillCanvas.height % 2;
  const frame = document.createElement("canvas");
  frame.width = w; frame.height = h;
  const ctx = frame.getContext("2d");

  function paint(i) {
    const t = i / Math.max(1, n - 1);
    const z = 1 + motion.zoom * t;
    const sway = Math.sin(t * Math.PI * 2) * motion.sway;
    ctx.fillStyle = "#000";
    ctx.fillRect(0, 0, w, h);
    ctx.save();
    ctx.translate(w / 2 + motion.turn * t * w, h / 2);
    ctx.rotate(sway);
    ctx.scale(z, z);
    ctx.drawImage(stillCanvas, -w / 2, -h / 2, w, h);
    ctx.restore();
    stamp(frame);
  }

  if (typeof MediaRecorder === "undefined" || !frame.captureStream) {
    paint(n - 1);
    return { kind: "image", url: frame.toDataURL("image/jpeg", 0.92), note: "this browser cannot record video; saved the last frame" };
  }

  const stream = frame.captureStream(fps);
  const types = ["video/mp4", "video/webm;codecs=vp8", "video/webm"];
  const mime = types.find((t) => MediaRecorder.isTypeSupported(t)) || "";
  let rec;
  try { rec = mime ? new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 3_000_000 }) : new MediaRecorder(stream); }
  catch { rec = new MediaRecorder(stream); }
  const chunks = [];
  rec.ondataavailable = (e) => { if (e.data && e.data.size) chunks.push(e.data); };
  const stopped = new Promise((res) => { rec.onstop = () => res(); });
  paint(0);
  rec.start(80);
  await new Promise((r) => setTimeout(r, 120));
  for (let i = 0; i < n; i++) {
    paint(i);
    await new Promise((r) => setTimeout(r, 1000 / fps));
  }
  if (rec.state === "recording") rec.stop();
  await stopped;
  stream.getTracks().forEach((t) => t.stop());
  const blob = new Blob(chunks, { type: rec.mimeType || "video/mp4" });
  if (!blob.size) {
    paint(n - 1);
    return { kind: "image", url: frame.toDataURL("image/jpeg", 0.92), note: "recorder returned empty — saved a still. Try Chrome, or replay is on-screen." };
  }
  return { kind: "video", url: URL.createObjectURL(blob) };
}

function pickSandbox(item) {
  state.source = { url: item.url, real: false, box: true };
  if (!state.dest.url) state.dest = { url: item.url, real: false, box: true };
  render();
}
function onFile(which, file) {
  state[which] = { url: URL.createObjectURL(file), real: true, box: state[which].box };
  render();
}
async function shareResult() {
  if (!state.result) return;
  try {
    const res = await fetch(state.result.url);
    const blob = await res.blob();
    const ext = state.result.kind === "video" ? "mp4" : "jpg";
    const file = new File([blob], `gotcha.${ext}`, { type: blob.type || "application/octet-stream" });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], text: WATERMARK });
      return;
    }
  } catch (_) {}
  window.open(state.result.url, "_blank");
}
async function runSwap() {
  const g = gateJob();

  if (!state.source.url || !state.dest.url) { state.err = "Need a source head and a destination photo."; render(); return; }
  state.busy = true; state.err = ""; render();
  try {
    const canvas = await swapHeads();
    state.lastStill = canvas;
    state.result = { kind: "image", url: canvas.toDataURL("image/jpeg", 0.92) };
  } catch (e) { state.err = e.message || String(e); }
  state.busy = false; render();
}
async function runVideo() {
  const g = gateJob();
  if (!g.ok) { state.err = g.reason; render(); return; }
  if (!state.source.url || !state.dest.url) { state.err = "Need both photos first."; render(); return; }
  state.busy = true; state.err = ""; render();
  try {
    if (!state.lastStill) state.lastStill = await swapHeads();
    state.result = await framesToVideo(state.lastStill, state.prompt);
  } catch (e) { state.err = e.message || String(e); }
  state.busy = false; render();
}
