<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Gotcha Lab" />
  <meta name="theme-color" content="#0b0c10" />
  <title>Gotcha Lab</title>
  <style>
    :root { --bg:#0b0c10; --panel:#171a21; --ink:#efece7; --muted:#9aa0a8; --gold:#e8c547; --danger:#ff6b6b; --ok:#6ee7b7; --line:#2c3140; }
    * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html,body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.45 Georgia,serif; min-height:100%; padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
    .wrap { max-width:560px; margin:0 auto; padding:16px; }
    h1{font-size:1.6rem;margin:0 0 .3rem} h2,h3{margin:.2rem 0 .6rem}
    .muted{color:var(--muted);font-size:.92rem} .wm{letter-spacing:.08em;text-transform:uppercase;font-size:.68rem;color:var(--muted)}
    .panel{background:var(--panel);border:1px solid var(--line);padding:14px;margin:12px 0;border-radius:10px}
    .warn{background:#2a1a12;border:1px solid #6b3a1f;padding:12px;border-radius:10px}
    button{display:inline-block;width:100%;margin:6px 0;padding:14px 12px;border:0;border-radius:10px;background:var(--gold);color:#111;font:700 16px/1 Georgia,serif}
    button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
    button:disabled{opacity:.5}
    label{display:block;margin:10px 0 6px;color:var(--muted)}
    input[type=text],input[type=number],textarea{width:100%;background:#0e1014;color:var(--ink);border:1px solid var(--line);padding:12px;border-radius:8px;font-size:16px}
    input[type=file],input[type=range]{width:100%;margin:8px 0}
    .row{display:flex;gap:8px} .row button{flex:1}
    .preview{width:100%;max-height:320px;object-fit:contain;background:#000;border-radius:8px}
    .faces{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
    .faces button{width:auto;padding:6px;margin:0}
    .faces img{width:72px;height:72px;display:block;border-radius:8px}
    .err{color:var(--danger)} .ok{color:var(--ok)} nav{display:flex;gap:8px} nav button{padding:10px}
  </style>
</head>
<body>
<div class="wrap" id="app"></div>
<script type="module">
const WATERMARK = "gotcha Ai generated";
const PHRASE = "I understand this output is synthetic media labeled gotcha Ai generated";
const MINOR = [/\b(child|children|kid|kids|toddler|infant|baby|babies)\b/i,/\b(minor|underage|under[- ]age|under[- ]18|u18)\b/i,/\b(teen(?!ager adult)|teenage(?! adult)|teenie|tween)\b/i,/\b(young|little)\s+(boy|girl|child)\b/i,/\b(pre[- ]?teen|middle[- ]school|elementary)\b/i,/\b(1[0-7])[- ]year/i,/\bloli\b|\bshota\b|\bpedoph/i];
const NONCONSENT = [/\bwithout (their|her|his|the person's) (consent|knowledge|permission)\b/i,/\bthey don'?t know\b/i,/\bnon[- ]consensual\b/i,/\brevenge porn\b/i,/\bsecretly (film|record|swap)\b/i];

const state = {
  view: "gate",
  subject: JSON.parse(localStorage.getItem("gotcha.subject") || "null"),
  consent: JSON.parse(localStorage.getItem("gotcha.consent") || "null"),
  source: { url:null, real:false, box:false },
  dest: { url:null, real:false, box:false },
  adult: true, blend: 0.96, prompt: "Turns toward camera, hair moves, soft light",
  busy:false, err:"", msg:"", result:null, lastStill:null, sandbox:[], sig:"", typed:"",
  purpose:"phone lab, consented likeness",
};
if (state.subject?.age_verified) state.view = "studio";
function save(){ localStorage.setItem("gotcha.subject", JSON.stringify(state.subject)); localStorage.setItem("gotcha.consent", JSON.stringify(state.consent)); }
function checkPrompt(t){ if(MINOR.some(r=>r.test(t||""))) return {ok:false,reason:"minors are not allowed"}; if(NONCONSENT.some(r=>r.test(t||""))) return {ok:false,reason:"non-consensual phrasing is blocked"}; return {ok:true}; }
function gateJob(){ const p=checkPrompt(state.prompt); if(!p.ok) return p; if(state.source.real&&!state.source.box) return {ok:false,reason:"check consent on the source photo"}; if(state.dest.real&&!state.dest.box) return {ok:false,reason:"check consent on the destination photo"}; if((state.source.real||state.dest.real)&&state.consent?.status!=="signed") return {ok:false,reason:"sign consent first (Consent tab)"}; return {ok:true}; }
function stamp(c){ const x=c.getContext("2d"), w=c.width,h=c.height; x.save(); x.font=`700 ${Math.max(13,w/26|0)}px Georgia,serif`; const t=WATERMARK, tw=x.measureText(t).width, pad=10; x.fillStyle="rgba(0,0,0,.65)"; x.fillRect(w-tw-pad*2,h-32,tw+pad*2,32); x.fillStyle="#fff"; x.fillText(t,w-tw-pad,h-12); x.restore(); }
function loadImg(src){ return new Promise((res,rej)=>{ const im=new Image(); im.onload=()=>res(im); im.onerror=()=>rej(new Error("could not read image")); im.src=src; }); }
function toCanvas(img,max=800){ const s=Math.min(1,max/Math.max(img.width,img.height)); const c=document.createElement("canvas"); c.width=Math.max(2,Math.round(img.width*s)); c.height=Math.max(2,Math.round(img.height*s)); c.getContext("2d").drawImage(img,0,0,c.width,c.height); return c; }
function hash(s){ let h=2166136261; for(const ch of s) h=Math.imul(h^ch.charCodeAt(0),16777619); return h>>>0; }
function rng(seed){ let x=seed||1; return ()=>{ x^=x<<13; x^=x>>>17; x^=x<<5; return ((x>>>0)%1000)/1000; }; }
function sandboxFace(label){
  const rnd=rng(hash(label)), size=440, c=document.createElement("canvas"); c.width=c.height=size;
  const ctx=c.getContext("2d"); ctx.fillStyle=`rgb(${40+rnd()*80},${50+rnd()*80},${70+rnd()*90})`; ctx.fillRect(0,0,size,size);
  const cx=size/2, cy=size*0.52;
  ctx.fillStyle=`rgb(${20+rnd()*50},${15+rnd()*40},${10+rnd()*30})`;
  ctx.beginPath(); ctx.ellipse(cx, cy-40, size*0.38, size*0.42, 0, Math.PI, 0); ctx.fill();
  ctx.fillStyle=`rgb(${155+rnd()*60},${120+rnd()*50},${100+rnd()*40})`;
  ctx.beginPath(); ctx.ellipse(cx,cy,size*0.24,size*0.30,0,0,7); ctx.fill();
  for (const dx of [-38,38]) { ctx.fillStyle="#f2f2f2"; ctx.beginPath(); ctx.ellipse(cx+dx,cy-18,16,11,0,0,7); ctx.fill(); ctx.fillStyle="#111"; ctx.beginPath(); ctx.arc(cx+dx,cy-18,6,0,7); ctx.fill(); }
  ctx.strokeStyle="#4a2218"; ctx.lineWidth=3; ctx.beginPath(); ctx.ellipse(cx,cy+40,20,11,0,.3,3); ctx.stroke();
  stamp(c); return c.toDataURL("image/jpeg",.9);
}
state.sandbox=["north","east","south","west","studio","gold"].map(n=>({label:"sandbox-"+n,url:sandboxFace("sandbox-"+n)}));

const WASM="https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm";
const FACE_MODEL="https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task";
const SEG_MODEL="https://storage.googleapis.com/mediapipe-models/image_segmenter/selfie_multiclass_256x256/float32/1/selfie_multiclass_256x256.tflite";
let visionMod=null, faceLm=null, segmenter=null;
async function vision(){
  if(!visionMod) visionMod=await import("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/+esm");
  return visionMod;
}
async function getFace(){
  if(faceLm) return faceLm;
  const v=await vision();
  const fs=await v.FilesetResolver.forVisionTasks(WASM);
  faceLm=await v.FaceLandmarker.createFromOptions(fs,{ baseOptions:{modelAssetPath:FACE_MODEL}, runningMode:"IMAGE", numFaces:1 });
  return faceLm;
}
async function getSeg(){
  if(segmenter) return segmenter;
  const v=await vision();
  const fs=await v.FilesetResolver.forVisionTasks(WASM);
  segmenter=await v.ImageSegmenter.createFromOptions(fs,{
    baseOptions:{ modelAssetPath:SEG_MODEL },
    runningMode:"IMAGE", outputCategoryMask:true, outputConfidenceMasks:false,
  });
  return segmenter;
}
async function landmarks(canvas){
  try{ const r=(await getFace()).detect(canvas); return r?.faceLandmarks?.[0]||null; }catch{ return null; }
}

/* selfie_multiclass: 0 bg, 1 hair, 2 body-skin, 3 face-skin, 4 clothes, 5 others */
function categoryMask(segResult, w, h, keep){
  const mask=segResult.categoryMask;
  if(!mask) return null;
  const raw=mask.getAsUint8Array ? mask.getAsUint8Array() : mask.getAsFloat32Array();
  const mw=mask.width, mh=mask.height;
  const c=document.createElement("canvas"); c.width=w; c.height=h;
  const ctx=c.getContext("2d");
  const img=ctx.createImageData(mw,mh);
  for(let i=0;i<mw*mh;i++){
    const id=raw[i]|0;
    const on=keep.has(id);
    img.data[i*4]=img.data[i*4+1]=img.data[i*4+2]=on?255:0;
    img.data[i*4+3]=255;
  }
  const tmp=document.createElement("canvas"); tmp.width=mw; tmp.height=mh;
  tmp.getContext("2d").putImageData(img,0,0);
  ctx.imageSmoothingEnabled=true;
  ctx.drawImage(tmp,0,0,w,h);
  return c;
}
async function segmentHead(canvas){
  try{
    const seg=await getSeg();
    const res=seg.segment(canvas);
    // hair + face skin + a little body skin (neck)
    return categoryMask(res, canvas.width, canvas.height, new Set([1,2,3]));
  }catch{ return null; }
}

function feat(lms,w,h){
  const p=i=>[lms[i].x*w,lms[i].y*h];
  const L=p(33), R=p(263), N=p(1), C=p(152), F=p(10);
  const mid=[(L[0]+R[0])/2,(L[1]+R[1])/2];
  const eyeDist=Math.hypot(R[0]-L[0],R[1]-L[1])||1;
  return {L,R,N,C,F,mid,eyeDist,angle:Math.atan2(R[1]-L[1],R[0]-L[0])};
}

function helmetMask(canvas, lms){
  const w=canvas.width,h=canvas.height,c=document.createElement("canvas");
  c.width=w; c.height=h;
  const ctx=c.getContext("2d");
  if(!lms){
    ctx.fillStyle="#fff";
    ctx.beginPath(); ctx.ellipse(w/2,h*0.42,w*0.28,h*0.38,0,0,7); ctx.fill();
    return c;
  }
  const f=feat(lms,w,h);
  const faceH=Math.hypot(f.F[0]-f.C[0],f.F[1]-f.C[1])||f.eyeDist*2.2;
  const nx=(f.F[0]-f.C[0])/faceH, ny=(f.F[1]-f.C[1])/faceH;
  const cx=f.mid[0]+nx*faceH*0.15;
  const cy=f.mid[1]-ny*faceH*0.05;
  ctx.fillStyle="#fff";
  ctx.beginPath();
  ctx.ellipse(cx, cy-faceH*0.15, f.eyeDist*1.55, faceH*1.15, f.angle, 0, 7);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(f.C[0], f.C[1], f.eyeDist*0.7, faceH*0.28, f.angle, 0, 7);
  ctx.fill();
  return c;
}

function growBlur(mask, px){
  const c=document.createElement("canvas"); c.width=mask.width; c.height=mask.height;
  const ctx=c.getContext("2d");
  ctx.filter=`blur(${Math.max(2,px|0)}px)`;
  ctx.drawImage(mask,0,0);
  ctx.filter="none";
  ctx.globalCompositeOperation="source-over";
  const img=ctx.getImageData(0,0,c.width,c.height);
  const d=img.data;
  for(let i=0;i<d.length;i+=4){
    const v=d[i];
    const t=v>18?255:0;
    d[i]=d[i+1]=d[i+2]=t; d[i+3]=255;
  }
  ctx.putImageData(img,0,0);
  ctx.filter=`blur(${Math.max(4,px|0)}px)`;
  ctx.drawImage(c,0,0);
  ctx.filter="none";
  return c;
}

function applyMaskAlpha(imgCanvas, maskCanvas){
  const w=imgCanvas.width,h=imgCanvas.height;
  const out=document.createElement("canvas"); out.width=w; out.height=h;
  const ctx=out.getContext("2d");
  ctx.drawImage(imgCanvas,0,0);
  const im=ctx.getImageData(0,0,w,h);
  const mk=maskCanvas.getContext("2d").getImageData(0,0,w,h).data;
  const d=im.data;
  for(let i=0;i<d.length;i+=4) d[i+3]=Math.min(d[i+3], mk[i]);
  ctx.putImageData(im,0,0);
  return out;
}

function similarityMap(srcF, dstF){
  const scale=dstF.eyeDist/srcF.eyeDist;
  const rot=dstF.angle-srcF.angle;
  return {scale, rot, sx:srcF.mid[0], sy:srcF.mid[1], dx:dstF.mid[0], dy:dstF.mid[1]};
}

function drawMapped(ctx, canvas, map){
  ctx.save();
  ctx.translate(map.dx, map.dy);
  ctx.rotate(map.rot);
  ctx.scale(map.scale, map.scale);
  ctx.translate(-map.sx, -map.sy);
  ctx.drawImage(canvas,0,0);
  ctx.restore();
}

function wipeWithBlur(dest, destHeadMask){
  const w=dest.width,h=dest.height;
  const out=document.createElement("canvas"); out.width=w; out.height=h;
  const ctx=out.getContext("2d");
  ctx.drawImage(dest,0,0);
  const blur=document.createElement("canvas"); blur.width=w; blur.height=h;
  const b=blur.getContext("2d");
  b.filter=`blur(${Math.max(16, Math.round(Math.min(w,h)/10))}px)`;
  b.drawImage(dest,0,0);
  const grown=growBlur(destHeadMask, Math.max(10, Math.min(w,h)/28));
  ctx.save();
  ctx.globalCompositeOperation="source-over";
  const tmp=document.createElement("canvas"); tmp.width=w; tmp.height=h;
  const t=tmp.getContext("2d");
  t.drawImage(blur,0,0);
  const im=t.getImageData(0,0,w,h);
  const mk=grown.getContext("2d").getImageData(0,0,w,h).data;
  const d=im.data;
  for(let i=0;i<d.length;i+=4) d[i+3]=mk[i];
  t.putImageData(im,0,0);
  ctx.drawImage(tmp,0,0);
  ctx.restore();
  return out;
}

function colorMatchCutout(cutout, dest, destF){
  const w=cutout.width,h=cutout.height;
  const ctx=cutout.getContext("2d");
  const im=ctx.getImageData(0,0,w,h);
  const dd=dest.getContext("2d").getImageData(0,0,dest.width,dest.height);
  let sr=0,sg=0,sb=0,sn=0,dr=0,dg=0,db=0,dn=0;
  const s=im.data;
  for(let i=0;i<s.length;i+=4){ if(s[i+3]>80){ sr+=s[i]; sg+=s[i+1]; sb+=s[i+2]; sn++; } }
  if(destF){
    const x0=destF.C[0]-destF.eyeDist*0.5|0, x1=destF.C[0]+destF.eyeDist*0.5|0;
    const y0=destF.C[1]|0, y1=Math.min(dest.height, destF.C[1]+destF.eyeDist*0.7)|0;
    for(let y=y0;y<y1;y++) for(let x=x0;x<x1;x++){
      if(x<0||x>=dest.width) continue;
      const i=(y*dest.width+x)*4; dr+=dd.data[i]; dg+=dd.data[i+1]; db+=dd.data[i+2]; dn++;
    }
  }
  if(sn<30||dn<20) return cutout;
  sr/=sn;sg/=sn;sb/=sn; dr/=dn;dg/=dn;db/=dn;
  const k=0.45;
  const kr=1-k+k*(dr/Math.max(8,sr)), kg=1-k+k*(dg/Math.max(8,sg)), kb=1-k+k*(db/Math.max(8,sb));
  for(let i=0;i<s.length;i+=4){ if(s[i+3]<8) continue; s[i]=Math.min(255,s[i]*kr); s[i+1]=Math.min(255,s[i+1]*kg); s[i+2]=Math.min(255,s[i+2]*kb); }
  ctx.putImageData(im,0,0);
  return cutout;
}

async function swapHeads(){
  const src=toCanvas(await loadImg(state.source.url), 820);
  const dst=toCanvas(await loadImg(state.dest.url), 820);
  const sl=await landmarks(src);
  const dl=await landmarks(dst);
  let sMask=await segmentHead(src);
  let dMask=await segmentHead(dst);
  if(!sMask) sMask=helmetMask(src, sl);
  if(!dMask) dMask=helmetMask(dst, dl);
  sMask=growBlur(sMask, Math.max(8, Math.min(src.width,src.height)/32));
  dMask=growBlur(dMask, Math.max(10, Math.min(dst.width,dst.height)/30));
  const cut=applyMaskAlpha(src, sMask);
  const srcF=sl?feat(sl,src.width,src.height):{mid:[src.width/2,src.height*.42],eyeDist:src.width*.22,angle:0,C:[src.width/2,src.height*.62]};
  const dstF=dl?feat(dl,dst.width,dst.height):{mid:[dst.width/2,dst.height*.42],eyeDist:dst.width*.22,angle:0,C:[dst.width/2,dst.height*.62]};
  const map=similarityMap(srcF,dstF);
  const cleared=wipeWithBlur(dst, dMask);
  const placed=document.createElement("canvas"); placed.width=dst.width; placed.height=dst.height;
  const pctx=placed.getContext("2d");
  drawMapped(pctx, colorMatchCutout(cut, dst, dstF), map);
  const out=document.createElement("canvas"); out.width=dst.width; out.height=dst.height;
  const o=out.getContext("2d");
  o.drawImage(cleared,0,0);
  o.globalAlpha=Number(state.blend);
  o.drawImage(placed,0,0);
  o.globalAlpha=1;
  stamp(out);
  return out;
}

async function framesToVideo(still, prompt){
  const p=(prompt||"").toLowerCase();
  const zoom=/(closer|walk|toward)/.test(p)?0.2:0.13;
  const fps=12, n=36;
  const w=still.width-still.width%2, h=still.height-still.height%2;
  const frame=document.createElement("canvas"); frame.width=w; frame.height=h;
  const ctx=frame.getContext("2d");
  const paint=i=>{
    const t=i/Math.max(1,n-1), z=1+zoom*t, sw=Math.sin(t*6.28)*0.02;
    ctx.fillStyle="#000"; ctx.fillRect(0,0,w,h);
    ctx.save(); ctx.translate(w/2,h/2); ctx.rotate(sw); ctx.scale(z,z); ctx.drawImage(still,-w/2,-h/2,w,h); ctx.restore();
    stamp(frame);
  };
  if(typeof MediaRecorder==="undefined"||!frame.captureStream){ paint(n-1); return {kind:"image",url:frame.toDataURL("image/jpeg",.92),note:"no recorder"}; }
  const stream=frame.captureStream(fps);
  const mime=["video/mp4","video/webm;codecs=vp8","video/webm"].find(t=>MediaRecorder.isTypeSupported(t))||"";
  let rec; try{ rec=mime?new MediaRecorder(stream,{mimeType:mime}):new MediaRecorder(stream);}catch{ rec=new MediaRecorder(stream); }
  const chunks=[]; rec.ondataavailable=e=>{ if(e.data&&e.data.size) chunks.push(e.data); };
  const done=new Promise(r=>rec.onstop=r);
  paint(0); rec.start(80); await new Promise(r=>setTimeout(r,100));
  for(let i=0;i<n;i++){ paint(i); await new Promise(r=>setTimeout(r,1000/fps)); }
  if(rec.state==="recording") rec.stop(); await done; stream.getTracks().forEach(t=>t.stop());
  const blob=new Blob(chunks,{type:rec.mimeType||"video/mp4"});
  if(!blob.size){ paint(n-1); return {kind:"image",url:frame.toDataURL("image/jpeg",.92),note:"empty recorder — still saved"}; }
  return {kind:"video",url:URL.createObjectURL(blob)};
}

function pickSandbox(item){ state.source={url:item.url,real:false,box:true}; if(!state.dest.url) state.dest={url:item.url,real:false,box:true}; render(); }
function onFile(which,file){ state[which]={url:URL.createObjectURL(file),real:true,box:state[which].box}; render(); }
async function shareResult(){ if(!state.result) return; try{ const blob=await (await fetch(state.result.url)).blob(); const file=new File([blob], state.result.kind==="video"?"gotcha.mp4":"gotcha.jpg",{type:blob.type}); if(navigator.canShare&&navigator.canShare({files:[file]})){ await navigator.share({files:[file],text:WATERMARK}); return; } }catch(_){ } window.open(state.result.url,"_blank"); }
async function runSwap(){ const g=gateJob(); if(!g.ok){state.err=g.reason;render();return;} if(!state.source.url||!state.dest.url){state.err="Need source head and target photo.";render();return;} state.busy=true;state.err="";render(); try{ const c=await swapHeads(); state.lastStill=c; state.result={kind:"image",url:c.toDataURL("image/jpeg",.92)}; }catch(e){ state.err=e.message||String(e);} state.busy=false;render(); }
async function runVideo(){ const g=gateJob(); if(!g.ok){state.err=g.reason;render();return;} if(!state.source.url||!state.dest.url){state.err="Need both photos.";render();return;} state.busy=true;state.err="";render(); try{ if(!state.lastStill) state.lastStill=await swapHeads(); state.result=await framesToVideo(state.lastStill,state.prompt);}catch(e){state.err=e.message||String(e);} state.busy=false;render(); }
function enter(age,name,ack){ if(!ack){state.err="Tick the ethics box.";render();return;} if(+age<18){state.err="18+ only.";render();return;} state.subject={subject_id:crypto.randomUUID(),age_verified:true,attested_age:+age,display_name:name||"operator"}; state.view="studio";state.err="";save();render(); }
function startConsent(){ state.consent={consent_id:crypto.randomUUID(),status:"started",purpose:state.purpose,adult_content_acknowledged:state.adult,id_verified:false,liveness_passed:false}; state.msg="ID stub → liveness stub → sign."; save();render(); }
function signConsent(){ if(!state.consent){state.err="Start a session first.";render();return;} if(!state.consent.id_verified||!state.consent.liveness_passed){state.err="Do both stubs first.";render();return;} if(!state.typed.toLowerCase().includes(PHRASE.toLowerCase())){state.err="Type the agreement phrase.";render();return;} if(!state.sig.trim()){state.err="Put a name on it.";render();return;} state.consent={...state.consent,status:"signed",signature_name:state.sig.trim(),signed_at:new Date().toISOString(),adult_content_acknowledged:state.adult}; state.msg="Signed."; state.err=""; save();render(); }

function render(){
  const el=document.getElementById("app");
  if(state.view==="gate"){
    el.innerHTML=`<p class="wm">18+ · ${WATERMARK}</p><h1>Gotcha Lab</h1>
      <div class="warn"><p>Cuts hair + face + jaw off the source, wipes the target head, lands the whole head on the body. Stamped <b>${WATERMARK}</b>.</p>
      <ul><li>No minors.</li><li>Real photos need the checkbox + signed consent.</li><li>Adult content allowed when the box is on.</li></ul></div>
      <div class="panel"><label>Name</label><input id="name" type="text"/><label>Age</label><input id="age" type="number" value="18"/>
      <label><input id="ack" type="checkbox"/> I am 18+ and will not use minors or anyone who did not consent.</label>
      ${state.err?`<p class="err">${state.err}</p>`:""}<button id="enter">Enter lab</button></div>`;
    el.querySelector("#enter").onclick=()=>enter(el.querySelector("#age").value,el.querySelector("#name").value,el.querySelector("#ack").checked);
    return;
  }
  const nav=`<nav><button class="${state.view==="studio"?"":"ghost"}" data-v="studio">Studio</button><button class="${state.view==="consent"?"":"ghost"}" data-v="consent">Consent</button></nav><p class="wm">${WATERMARK}</p>`;
  if(state.view==="consent"){
    el.innerHTML=`${nav}<h2>Consent</h2>${state.err?`<p class="err">${state.err}</p>`:""}${state.msg?`<p class="ok">${state.msg}</p>`:""}
      <div class="panel"><label>Purpose</label><textarea id="purpose">${state.purpose}</textarea>
      <label><input id="adultc" type="checkbox" ${state.adult?"checked":""}/> Adult content of my consented likeness is allowed</label>
      <button id="start">Start session</button><p class="muted">Status: ${state.consent?.status||"none"}</p>
      <div class="row"><button class="ghost" id="idv">ID stub</button><button class="ghost" id="liv">Liveness stub</button></div>
      <label>Sign as</label><input id="sig" type="text" value="${state.sig}"/>
      <label>Type: ${PHRASE}</label><textarea id="typed">${state.typed}</textarea><button id="sign">Sign</button></div>`;
    el.querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>{state.view=b.dataset.v;state.err="";render();});
    el.querySelector("#purpose").oninput=e=>state.purpose=e.target.value;
    el.querySelector("#adultc").onchange=e=>state.adult=e.target.checked;
    el.querySelector("#sig").oninput=e=>state.sig=e.target.value;
    el.querySelector("#typed").oninput=e=>state.typed=e.target.value;
    el.querySelector("#start").onclick=startConsent;
    el.querySelector("#idv").onclick=()=>{if(state.consent){state.consent.id_verified=true;state.consent.status="id_verified";save();render();}};
    el.querySelector("#liv").onclick=()=>{if(state.consent){state.consent.liveness_passed=true;state.consent.status="liveness_verified";save();render();}};
    el.querySelector("#sign").onclick=signConsent;
    return;
  }
  el.innerHTML=`${nav}<h2>Studio</h2><p class="muted">Use two real photos. Source = the whole head you want. Target = the body. First swap takes longer (loads hair segmenter).</p>
    ${state.err?`<p class="err">${state.err}</p>`:""}
    <div class="panel"><h3>Sandbox</h3><div class="faces" id="faces"></div></div>
    <div class="panel"><h3>Source head (hair and all)</h3>
      <label><input id="boxs" type="checkbox" ${state.source.box?"checked":""}/> I have consent for this head</label>
      <input id="srcfile" type="file" accept="image/*"/><input id="srccam" type="file" accept="image/*" capture="user"/>
      ${state.source.url?`<img class="preview" src="${state.source.url}" alt="source"/>`:""}</div>
    <div class="panel"><h3>Target body</h3>
      <label><input id="boxd" type="checkbox" ${state.dest.box?"checked":""}/> I have consent for this photo</label>
      <input id="dstfile" type="file" accept="image/*"/><input id="dstcam" type="file" accept="image/*" capture="environment"/>
      ${state.dest.url?`<img class="preview" src="${state.dest.url}" alt="dest"/>`:""}</div>
    <div class="panel">
      <label><input id="adult" type="checkbox" ${state.adult?"checked":""}/> Adult / sexual / nude content is acceptable</label>
      <label>Seam ${state.blend}</label><input id="blend" type="range" min="0.7" max="1" step="0.01" value="${state.blend}"/>
      <label>Video move</label><textarea id="prompt">${state.prompt}</textarea>
      <button id="swap" ${state.busy?"disabled":""}>${state.busy?"Cutting head…":"Swap whole head"}</button>
      <button class="ghost" id="vid" ${state.busy?"disabled":""}>Make video</button>
    </div>
    ${state.result?`<div class="panel"><h3>Result</h3>${state.result.note?`<p class="muted">${state.result.note}</p>`:""}
      ${state.result.kind==="video"?`<video class="preview" controls playsinline autoplay loop src="${state.result.url}"></video>`:`<img class="preview" src="${state.result.url}" alt="result"/>`}
      <p class="wm">${WATERMARK}</p><button id="share">Share / Save to Photos</button></div>`:""}`;
  const faces=el.querySelector("#faces");
  state.sandbox.forEach(item=>{ const b=document.createElement("button"); b.className="ghost"; b.innerHTML=`<img src="${item.url}" alt=""/><div class="muted">${item.label.replace("sandbox-","")}</div>`; b.onclick=()=>pickSandbox(item); faces.appendChild(b); });
  el.querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>{state.view=b.dataset.v;state.err="";render();});
  el.querySelector("#boxs").onchange=e=>state.source.box=e.target.checked;
  el.querySelector("#boxd").onchange=e=>state.dest.box=e.target.checked;
  el.querySelector("#adult").onchange=e=>state.adult=e.target.checked;
  el.querySelector("#blend").oninput=e=>state.blend=e.target.value;
  el.querySelector("#prompt").oninput=e=>state.prompt=e.target.value;
  el.querySelector("#srcfile").onchange=e=>e.target.files[0]&&onFile("source",e.target.files[0]);
  el.querySelector("#srccam").onchange=e=>e.target.files[0]&&onFile("source",e.target.files[0]);
  el.querySelector("#dstfile").onchange=e=>e.target.files[0]&&onFile("dest",e.target.files[0]);
  el.querySelector("#dstcam").onchange=e=>e.target.files[0]&&onFile("dest",e.target.files[0]);
  el.querySelector("#swap").onclick=runSwap;
  el.querySelector("#vid").onclick=runVideo;
  const sh=el.querySelector("#share"); if(sh) sh.onclick=shareResult;
}
render();
</script>
</body>
</html>
